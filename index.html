<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Алхам">
<meta name="description" content="Deriv Step Index ба XAUUSD-д зориулсан арилжааны тэмдэглэл.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='7' fill='%2316201B'/%3E%3Cpath d='M6 22h5v-5h5v-5h5V7h3' fill='none' stroke='%23D3A94B' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Алхам арилжааны тэмдэглэл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: багажны самбар — наалдсан толгой ба табууд, доор нь 12 баганат сүлжээ; утсан дээр нэг багана */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#E4E9E6; --ink:#16201B; --muted:#5A6A62; --line:#D0D8D3;
  --accent:#8E6A17; --accent-soft:#F1E7CF; --accent-ink:#FFFFFF;
  --gain:#1C7449; --gain-soft:#D7EEDF; --loss:#B13636; --loss-soft:#F6DCDC; --warn:#A8670F; --warn-soft:#F7E6CC;
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EBE7; --muted:#92A29A; --line:#28342F;
  --accent:#D3A94B; --accent-soft:#3A3020; --accent-ink:#1A1406;
  --gain:#4FC48C; --gain-soft:#173326; --loss:#F07C7C; --loss-soft:#3A1E1E; --warn:#E6B45C; --warn-soft:#3A2D17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EBE7; --muted:#92A29A; --line:#28342F;
  --accent:#D3A94B; --accent-soft:#3A3020; --accent-ink:#1A1406;
  --gain:#4FC48C; --gain-soft:#173326; --loss:#F07C7C; --loss-soft:#3A1E1E; --warn:#E6B45C; --warn-soft:#3A2D17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--gain)} .neg{color:var(--loss)} .muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.mode{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 11px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{margin-right:auto}

/* banner */
.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid}
.banner.demo{background:var(--accent-soft);border-color:var(--accent);}
.banner.stop{background:var(--loss-soft);border-color:var(--loss);color:var(--ink)}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.banner p{margin:0;flex:1;min-width:220px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--gain-soft);color:var(--gain)} .pill.bad{background:var(--loss-soft);color:var(--loss)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.dir{font-family:var(--f-mono);font-size:12px;font-weight:600}
.dir.buy{color:var(--gain)} .dir.sell{color:var(--loss)}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 76px;gap:10px;align-items:center;font-size:13px}
.bar .t{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.bar .t i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .t .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);left:50%}
.bar .n{text-align:right}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{border-radius:6px;min-height:58px;padding:5px 6px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:space-between;font-size:11px;min-width:0}
.cal .d.out{opacity:.35}
.cal .d .dn{color:var(--muted)}
.cal .d .dp{font-family:var(--f-mono);font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:520px){.cal .d{min-height:44px;padding:3px}.cal .d .dp{font-size:9px}}

/* forms */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,12,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin-right:auto;font-family:var(--f-display);font-size:15px;font-weight:500}
.dlg-b{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.dlg-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dlg-f .sp{margin-right:auto}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{padding:0;margin-bottom:8px}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
@media (max-width:700px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w2{grid-column:span 2} .f.w4{grid-column:1/-1}
.f label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=datetime-local],input[type=url],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=number]{font-family:var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--bg);padding:7px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg.yn button[data-v="y"][aria-pressed="true"]{background:var(--gain);color:#fff}
.seg.yn button[data-v="n"][aria-pressed="true"]{background:var(--loss);color:#fff}
.seg.yn.rev button[data-v="y"][aria-pressed="true"]{background:var(--loss);color:#fff}
.seg.yn.rev button[data-v="n"][aria-pressed="true"]{background:var(--gain);color:#fff}
.seg.bs button[data-v="Buy"][aria-pressed="true"]{background:var(--gain);color:#fff}
.seg.bs button[data-v="Sell"][aria-pressed="true"]{background:var(--loss);color:#fff}
.qrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:0}
.qrow span{flex:1;min-width:200px}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
@media (max-width:700px){.preview{grid-template-columns:repeat(2,minmax(0,1fr))}}
.preview div{display:flex;flex-direction:column;min-width:0}
.preview b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.warns{display:flex;flex-direction:column;gap:6px}
.warns div{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.warns div.bad{background:var(--loss-soft);color:var(--loss)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* 20 trade dots */
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dot.ok{border:0;background:var(--gain);color:#fff}
.dot.okl{border:0;background:var(--accent);color:var(--accent-ink)}
.bigstat{font-family:var(--f-display);font-size:34px;font-weight:700}

.principle{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:13px}
.principle b.lab{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;max-width:calc(100vw - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--loss-soft);padding:8px 10px;border-radius:8px;font-size:13px}
svg text{font-family:var(--f-mono)}
.inst-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:6px;align-items:end}
@media (max-width:700px){.inst-row{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brand">
        <svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="var(--ink)"/><path d="M6 22h5v-5h5v-5h5V7h3" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <div><b>Алхам</b><br><span>Step Index ба XAUUSD арилжааны тэмдэглэл</span></div>
      </div>
      <button class="mode" id="modeTag" type="button" style="border:0;cursor:pointer">Ачаалж байна…</button>
      <button class="btn primary" id="addBtn" type="button">+ Арилжаа</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-v="dash">Самбар</button>
      <button class="tab" role="tab" data-v="trades">Арилжаанууд</button>
      <button class="tab" role="tab" data-v="day">Өдрийн бэлтгэл</button>
      <button class="tab" role="tab" data-v="ex">20 арилжааны дасгал</button>
      <button class="tab" role="tab" data-v="review">Дүгнэлт</button>
      <button class="tab" role="tab" data-v="settings">Тохиргоо</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<dialog id="dlg"><form class="dlg" id="tradeForm" method="dialog" novalidate></form></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";
/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=+v;return isFinite(n)?n:null};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowLocal=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function fm(v,dec=2){if(v==null||!isFinite(v))return "—";const s=Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});return (v<0?"−":"")+s}
function money(v){if(v==null||!isFinite(v))return "—";const c=S.settings.currency||"$";return (v<0?"−":v>0?"+":"")+c+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function rfmt(v){if(v==null||!isFinite(v))return "—";return (v<0?"−":v>0?"+":"")+Math.abs(v).toFixed(2)+"R"}
function pct(v,d=0){if(v==null||!isFinite(v))return "—";return (v*100).toFixed(d)+"%"}
const cls=v=>v==null?"":v>0?"pos":v<0?"neg":"";
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return `${y}-W${pad(w)}`}
function weekStart(key){const [y,w]=key.split("-W").map(Number);const s=new Date(y,0,4);const day=s.getDay()||7;s.setDate(s.getDate()-day+1+(w-1)*7);return s}
let toastT;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

/* ---------------- defaults ---------------- */
const DEFAULT_SETTINGS={
  currency:"$",startBalance:1000,riskPct:1,maxRiskPct:2,dailyLossPct:3,maxTradesDay:5,
  instruments:[
    {name:"Step Index",cs:10,minLot:0.1,lotStep:0.01,tick:0.1,kind:"step"},
    {name:"Step Index 200",cs:10,minLot:0.1,lotStep:0.01,tick:0.2,kind:"step"},
    {name:"Step Index 300",cs:10,minLot:0.1,lotStep:0.01,tick:0.3,kind:"step"},
    {name:"Step Index 400",cs:10,minLot:0.1,lotStep:0.01,tick:0.4,kind:"step"},
    {name:"Step Index 500",cs:10,minLot:0.1,lotStep:0.01,tick:0.5,kind:"step"},
    {name:"XAUUSD",cs:100,minLot:0.01,lotStep:0.01,tick:0.01,kind:"gold"}
  ],
  setups:["Тренд үргэлжлэл","Дэмжлэг/эсэргүүцлээс буцалт","Breakout","Range-ийн хил","Сешн нээлтийн хөдөлгөөн"],
  rules:{entry:"",stop:"",target:"",size:"",time:"",noTrade:""}
};
const EMOTIONS=["Тайван","Айдас","Шунал","Найдвар","Өшөө авах","Уйдал","Хэт итгэл","Яаруу"];
const EXITS=["Stop-д хүрсэн","Зорилтод хүрсэн","Дүрмээр гарсан","Айснаасаа","Найдвар тасарсан","Бусад"];
const DAY_Q=[
  "Өнөөдрийн арилжааны төлөвлөгөө (ямар setup хайх) тодорхой юу?",
  "Өнөөдрийн хамгийн их алдагдлын хязгаар тогтоосон уу?",
  "Нэг арилжаанд тохиргоонд заасан эрсдэлээс ихгүй авахаар шийдсэн үү?",
  "Сэтгэл санаа тайван уу? (уурласан, ядарсан, өшөө авах хүсэлгүй)",
  "Өчигдрийн алдагдлыг буцааж авах гэсэн бодолгүй юу?",
  "Өчигдөр том ашиг олсон бол хэт итгэлгүй, дүрмээ мөрдөхөд бэлэн үү?",
  "Аль ч арилжаа алдагдалтай байж болно гэдгийг хүлээн зөвшөөрч байна уу?",
  "Зах зээл юу ч хийж болно. Би таамаглахгүй, дүрмээрээ хариу үйлдэл хийхэд бэлэн үү?"

  if(res.error)throw res.error;

/* ---------------- calculations ---------------- */
function instOf(name){return S.settings.instruments.find(i=>i.name===name)||{name:name||"?",cs:1,minLot:0.01,lotStep:0.01,tick:0.01,kind:"other"}}
function sessionOf(t,ins){if(ins.kind==="step")return "24/7";if(!t.open)return "—";const d=new Date(t.open);if(isNaN(d))return "—";const h=d.getUTCHours();
  if(h>=12&&h<16)return "Лондон+NY";if(h>=7&&h<12)return "Лондон";if(h>=16&&h<21)return "Нью-Йорк";return "Ази"}
function calc(t){
  const ins=instOf(t.inst),cs=+ins.cs||1,dir=t.dir==="Sell"?-1:1;
  const e=num(t.entry),sl=num(t.sl),tp=num(t.tp),x=num(t.exit),lots=num(t.lots),fees=num(t.fees)||0;
  const risk=(e!=null&&sl!=null&&lots!=null&&e!==sl)?Math.abs(e-sl)*lots*cs:null;
  let pnl=null;const act=num(t.actual);
  if(act!=null)pnl=act;else if(e!=null&&x!=null&&lots!=null)pnl=(x-e)*dir*lots*cs+fees;
  const R=(pnl!=null&&risk)?pnl/risk:null;
  const bal=num(t.balance);const riskPct=(risk!=null&&bal)?risk/bal:null;
  const rr=(e!=null&&sl!=null&&tp!=null&&e!==sl)?Math.abs(tp-e)/Math.abs(e-sl):null;
  const steps=(e!=null&&sl!=null&&+ins.tick)?Math.round(Math.abs(e-sl)/ins.tick):null;
  const closed=pnl!=null;
  const quality=!closed||!t.followed?null:t.followed==="y"?(pnl>=0?"Сайн":"Сайн алдагдал"):(pnl>0?"Муу ашиг":"Муу");
  const when=t.close||t.open||"";
  return {ins,cs,risk,pnl,R,riskPct,rr,steps,closed,quality,session:sessionOf(t,ins),when,date:when.slice(0,10)};
}
function enriched(trades){return Object.entries(trades).map(([id,t])=>Object.assign({id},t,{_:calc(t)})).sort((a,b)=>(a._.when<b._.when?-1:a._.when>b._.when?1:0))}
function stats(list){
  const closed=list.filter(t=>t._.closed);
  const wins=closed.filter(t=>t._.pnl>0),losses=closed.filter(t=>t._.pnl<0);
  const net=closed.reduce((a,t)=>a+t._.pnl,0);
  const gw=wins.reduce((a,t)=>a+t._.pnl,0),gl=Math.abs(losses.reduce((a,t)=>a+t._.pnl,0));
  const Rs=closed.filter(t=>t._.R!=null).map(t=>t._.R);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const fy=list.filter(t=>t.followed==="y").length,fn=list.filter(t=>t.followed==="n").length;
  return {n:closed.length,wins:wins.length,losses:losses.length,net,winRate:closed.length?wins.length/closed.length:null,
    pf:gl?gw/gl:(gw?Infinity:null),exp:avg(Rs),sumR:Rs.reduce((a,b)=>a+b,0),
    avgWinR:avg(Rs.filter(r=>r>0)),avgLossR:avg(Rs.filter(r=>r<0)),worstR:Rs.length?Math.min(...Rs):null,
    disc:(fy+fn)?fy/(fy+fn):null,fy,fn,
    moved:list.filter(t=>t.movedStop==="y").length,addL:list.filter(t=>t.addedLoser==="y").length,addW:list.filter(t=>t.addedWinner==="y").length,
    notAcc:list.filter(t=>t.accepted==="n").length,overRisk:list.filter(t=>t._.riskPct!=null&&t._.riskPct>S.settings.maxRiskPct/100).length,
    badWin:list.filter(t=>t._.quality==="Муу ашиг").length,fearExit:list.filter(t=>t.exitReason==="Айснаасаа").length,
    calm:avg(list.filter(t=>t.calm).map(t=>+t.calm))};
}
function groupBy(list,keyFn){const m=new Map();list.forEach(t=>{const k=keyFn(t);if(k==null||k==="")return;if(!m.has(k))m.set(k,[]);m.get(k).push(t)});return m}
function currentBalance(list){return (+S.settings.startBalance||0)+list.filter(t=>t._.closed).reduce((a,t)=>a+t._.pnl,0)}

  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const out={};const base=new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()-41);
  let bal=1000;
  for(let i=0;i<46;i++){
    const d=new Date(base);d.setDate(d.getDate()+Math.floor(i*0.9));
    const gold=rnd()<0.45;const inst=gold?"XAUUSD":(rnd()<0.6?"Step Index":"Step Index 200");
    const ins=instOf(inst);const hour=gold?[9,16,21,22][Math.floor(rnd()*4)]:Math.floor(rnd()*24);
    d.setHours(hour,Math.floor(rnd()*60));
    const dir=rnd()<0.5?"Buy":"Sell";const e=gold?+(2380+rnd()*80).toFixed(2):+(7000+rnd()*800).toFixed(1);
    const stopDist=gold?+(3+rnd()*4).toFixed(2):+(ins.tick*(20+Math.floor(rnd()*30))).toFixed(1);
    const lots=gold?Math.max(0.01,+((bal*0.01)/(stopDist*100)).toFixed(2)):Math.max(0.1,+((bal*0.01)/(stopDist*10)).toFixed(2));
    const sign=dir==="Buy"?1:-1;const emo=rnd()<0.62?"Тайван":EMOTIONS[1+Math.floor(rnd()*7)];
    const followed=emo==="Тайван"?(rnd()<0.9?"y":"n"):(rnd()<0.45?"y":"n");
    let r=rnd()<(followed==="y"?0.47:0.35)?(1+rnd()*2.2):-1;
    if(followed==="n"&&r<0&&rnd()<0.5)r=-1.4-rnd()*0.8;
    const exit=+(e+sign*r*stopDist).toFixed(gold?2:1);
    const close=new Date(d.getTime()+(20+rnd()*240)*6e4);
    const t={inst,dir,open:`${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`,close:`${ymd(close)}T${pad(close.getHours())}:${pad(close.getMinutes())}`,
      entry:e,sl:+(e-sign*stopDist).toFixed(gold?2:1),tp:+(e+sign*stopDist*2.5).toFixed(gold?2:1),exit,lots,fees:0,actual:"",balance:+bal.toFixed(2),
      setup:S.settings.setups[Math.floor(rnd()*S.settings.setups.length)],emotion:emo,
      exitReason:r>2?"Зорилтод хүрсэн":r>0?(rnd()<0.3?"Айснаасаа":"Дүрмээр гарсан"):"Stop-д хүрсэн",
      accepted:followed==="y"?"y":(rnd()<0.5?"n":"y"),movedStop:followed==="n"&&r<-1?"y":"n",addedLoser:followed==="n"&&rnd()<0.2?"y":"n",addedWinner:r>2&&rnd()<0.4?"y":"n",
      followed,exercise:i>=30?"y":"",calm:emo==="Тайван"?4+Math.round(rnd()):2+Math.round(rnd()),notes:"Жишээ арилжаа",chart:""};
    bal+=calc(t).pnl||0;out["demo"+i]=t;
  }
  return out;
}

/* ---------------- charts ---------------- */
function equitySVG(list,w){
  const closed=list.filter(t=>t._.closed);const start=+S.settings.startBalance||0;
  const pts=[start];closed.forEach(t=>pts.push(pts[pts.length-1]+t._.pnl));
  const H=220,L=58,R=12,T=14,B=26;w=Math.max(280,w);
  if(pts.length<2)return `<div class="empty">Хаагдсан арилжаа нэмэгдмэгц энд дансны өсөлтийн муруй гарна.</div>`;
  let min=Math.min(...pts),max=Math.max(...pts);if(min===max){min-=1;max+=1}const padv=(max-min)*0.08;min-=padv;max+=padv;
  const x=i=>L+(w-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  const ticks=4;let grid="";for(let k=0;k<=ticks;k++){const v=min+(max-min)*k/ticks;const yy=y(v);grid+=`<line x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(S.settings.currency)}${Math.round(v).toLocaleString("en-US")}</text>`}
  let d="";pts.forEach((v,i)=>{d+=(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});
  const area=d+`L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`;
  let peak=-Infinity,dd=0;pts.forEach(v=>{peak=Math.max(peak,v);dd=Math.max(dd,peak-v)});
  const last=pts[pts.length-1],up=last>=start;const col=up?"var(--gain)":"var(--loss)";
  const xl=[0,Math.floor((pts.length-1)/2),pts.length-1].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="10" fill="var(--muted)">#${i}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${H}" width="100%" height="${H}" role="img" aria-label="Дансны өсөлтийн муруй">
    ${grid}<line x1="${L}" x2="${w-R}" y1="${y(start)}" y2="${y(start)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
    <path d="${area}" fill="${col}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last)}" r="4" fill="${col}"/>${xl}</svg>
    <div class="muted" style="font-size:12px">Эхлэл ${money(start).replace("+","")} → одоо <span class="num ${cls(last-start)}">${money(last).replace("+","")}</span> · Хамгийн их уналт <span class="num neg">${S.settings.currency}${fm(dd)}</span></div>`;
}
function barsHTML(rows,valFmt){
  if(!rows.length)return `<div class="muted">Өгөгдөл алга.</div>`;
  const mx=Math.max(...rows.map(r=>Math.abs(r.v)),0.0001);
  return `<div class="bars">${rows.map(r=>{const w=Math.abs(r.v)/mx*50;const left=r.v>=0?50:50-w;
    return `<div class="bar"><span title="${esc(r.k)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.k)} <span class="muted">(${r.n})</span></span><div class="t"><i style="left:${left}%;width:${w}%;background:${r.v>=0?"var(--gain)":"var(--loss)"}"></i><span class="zero"></span></div><span class="n num ${cls(r.v)}">${valFmt(r.v)}</span></div>`}).join("")}</div>`;
}

function readForm(){
  const f=$("#tradeForm");const t=editing.t;
  $$("[name]",f).forEach(el=>{t[el.name]=el.value});
  $$("[data-seg]",f).forEach(s=>{const b=$("button[aria-pressed='true']",s);t[s.dataset.seg]=b?b.dataset.v:""});
  ["entry","sl","tp","exit","lots","fees","actual","balance"].forEach(k=>{const n=num(t[k]);t[k]=n==null?"":n});
  return t;
}
function updatePreview(){
  if(!editing)return;const t=readForm();const c=calc(t);const ins=c.ins;
  const bal=num(t.balance);const e=num(t.entry),sl=num(t.sl);
  let sug=null;if(bal&&e!=null&&sl!=null&&e!==sl){const raw=bal*(S.settings.riskPct/100)/(Math.abs(e-sl)*(+ins.cs||1));const st=+ins.lotStep||0.01;sug=Math.floor(raw/st+1e-9)*st;sug=+sug.toFixed(4)}
  const lh=$("#lotHint");if(lh){lh.textContent=sug==null?"Зөвлөмж: —":`Зөвлөмж ${S.settings.riskPct}%: ${sug} лот`;lh.dataset.lot=sug==null?"":sug}
  $("#pv").innerHTML=`<div><span class="lbl">Эрсдэл</span><b class="${c.riskPct!=null&&c.riskPct>S.settings.maxRiskPct/100?"neg":""}">${c.risk==null?"—":S.settings.currency+fm(c.risk)}${c.riskPct==null?"":` · ${(c.riskPct*100).toFixed(2)}%`}</b></div>
    <div><span class="lbl">Төлөвлөсөн R:R</span><b>${c.rr==null?"—":"1 : "+c.rr.toFixed(2)}</b></div>
    <div><span class="lbl">${ins.kind==="step"?"Stop хүртэлх алхам":"Stop зай (tick)"}</span><b>${c.steps==null?"—":c.steps.toLocaleString("en-US")}</b></div>
    <div><span class="lbl">${c.closed?"P/L · R":"Сешн"}</span><b class="${cls(c.pnl)}">${c.closed?money(c.pnl)+" · "+rfmt(c.R):esc(c.session)}</b></div>`;
  const w=[];const lots=num(t.lots);
  if(e!=null&&sl==null)w.push(["bad","Stop-loss алга. Сайн ялагдагч орохоосоо өмнө гарах цэгээ мэддэг."]);
  if(c.riskPct!=null&&c.riskPct>S.settings.maxRiskPct/100)w.push(["bad",`Эрсдэл ${(c.riskPct*100).toFixed(2)}% нь таны дээд хязгаар ${S.settings.maxRiskPct}%-иас их байна.`]);
  if(lots!=null&&+ins.minLot&&lots<+ins.minLot)w.push(["",`${ins.name}-ийн хамгийн бага лот ${ins.minLot}.`]);
  if(e!=null&&sl!=null&&num(t.tp)!=null){const d=t.dir==="Sell"?-1:1;if((sl-e)*d>0)w.push(["bad",`${t.dir} арилжаанд stop орох үнийн ${d>0?"доор":"дээр"} байх ёстой.`]);if((num(t.tp)-e)*d<0)w.push(["bad",`${t.dir} арилжаанд зорилт орох үнийн ${d>0?"дээр":"доор"} байх ёстой.`])}
  if(t.accepted==="n")w.push(["","Эрсдэлээ хүлээн зөвшөөрөөгүй бол орохгүй байх нь дээр. Хүлээн зөвшөөрөөгүй эрсдэл айдас болж хувирдаг."]);
  if(t.emotion&&t.emotion!=="Тайван")w.push(["",`Мэдрэмж: ${t.emotion}. Энэ үед хийсэн арилжаанууд таны статистикт тусад нь харагдана.`]);
  if(t.movedStop==="y"||t.addedLoser==="y")w.push(["bad","Энэ арилжаа дүрэм зөрчсөн гэж тэмдэглэгдэнэ."]);
  $("#pvw").innerHTML=w.map(([k,m])=>`<div class="${k}">${esc(m)}</div>`).join("");
}
async function submitForm(){
  const t=readForm();

  if(!S.canSave){toast("Энэ хуудсанд хадгалах эрх алга.");return}
  const id=editing.id||uid();const clean={};Object.keys(t).forEach(k=>{if(t[k]!==undefined)clean[k]=t[k]});
  $("#dlg").close();editing=null;
  if(S.view==="dash"&&!Object.keys(S.trades).length)DEMO=null;
  await put("trades",id,clean);toast("Хадгаллаа");
}

/* ---------------- export / import ---------------- */
async function offer(filename,data){
  let dl=null;try{dl=window.claude&&typeof claude.use==="function"?await claude.use("downloads"):null}catch(e){}
  if(!dl){try{const type=filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json";const url=URL.createObjectURL(new Blob([data],{type}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
    catch(e){toast("Файл татаж чадсангүй.")}return}
  try{await dl.save({filename,data})}catch(e){if(e&&e.code==="declined")return;toast("Файл татаж чадсангүй.")}
}
function csv(){
  const cols=["open","close","inst","dir","setup","entry","sl","tp","exit","lots","fees","actual","balance","emotion","accepted","exitReason","movedStop","addedLoser","addedWinner","followed","exercise","calm","notes","chart"];
  const extra=["risk","riskPct","pnl","R","quality","session"];
  const q=v=>{const s=String(v??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const rows=enriched(S.trades).map(t=>cols.map(c=>q(t[c])).concat([t._.risk,t._.riskPct==null?"":(t._.riskPct*100).toFixed(2),t._.pnl,t._.R==null?"":t._.R.toFixed(3),t._.quality||"",t._.session].map(q)).join(","));
  return "﻿"+cols.concat(extra).join(",")+"\n"+rows.join("\n");
}
async function importJson(file){
  try{const o=JSON.parse(await file.text());if(!o||typeof o!=="object"||!o.trades)throw 0;
    if(o.settings)await saveSettings(o.settings);
    for(const coll of ["trades","days","reviews","beliefs"]){const m=o[coll]||{};for(const [k,v] of Object.entries(m)){await put(coll,k,v)}}
    toast(`${Object.keys(o.trades).length} арилжаа сэргээлээ.`)}catch(e){toast("Файлыг уншиж чадсангүй. Алхам-аас татсан JSON нөөц эсэхийг шалгана уу.")}
}

  else if(act==="sbSave"){const url=normUrl($("#sbUrl").value);const key=normKey($("#sbKey").value);SB.draft.url=$("#sbUrl").value;SB.draft.key=$("#sbKey").value;SB.err="";

    else if(!key)SB.err="Түлхүүрээ оруулна уу. Supabase → Project Settings → API Keys → Publishable key-ийн хуулах товчийг дарж хуулна.";

    if(SB.err){a.blur();render();return}
    try{localStorage.setItem(SUPA_CFG_KEY,JSON.stringify({url,key}))}catch(e){}a.blur();initSupa()}
  else if(act==="sbIn"||act==="sbUp"){const email=($("#sbEmail").value||"").trim(),password=$("#sbPass").value||"";
    SB.draft.email=email;
    if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){SB.err="Имэйлээ зөв оруулна уу.";render();return}
    if(password.length<6){SB.err=password?"Нууц үг хамгийн багадаа 6 тэмдэгт байх ёстой.":"Нууц үгээ баруун талын талбарт бичнэ үү (6-аас дээш тэмдэгт).";render();setTimeout(()=>{const el=$("#sbPass");if(el)el.focus()},50);return}
    SB.draft.email=email;SB.busy=true;SB.err="";a.blur();render();
    try{if(act==="sbIn"){const {error}=await SB.client.auth.signInWithPassword({email,password});if(error)throw error;toast("Нэвтэрлээ")}
      else{const {data,error}=await SB.client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session)toast("Бүртгэл үүслээ. Имэйлээ шалгаж баталгаажуулаад Нэвтрэх дарна уу.");else toast("Бүртгэл үүсч, нэвтэрлээ")}}
    catch(e){SB.err=supaMsg(e)}
    SB.busy=false;render()}
  else if(act==="sbShow"){const el=$("#sbPass");if(el){el.type=el.type==="password"?"text":"password";a.textContent=el.type==="password"?"Харах":"Нуух"}}
  else if(act==="sbOut"){await SB.client.auth.signOut();toast("Гарлаа")}
  else if(act==="sbSync"){await flushPending();await pullAll();toast(SB.status==="ok"?"Синк хийлээ":SB.err||"Синк хийж чадсангүй")}
  else if(act==="sbMigrate")supaMigrateLocal();
  else if(act==="sbForget"){try{localStorage.removeItem(SUPA_CFG_KEY)}catch(e){}if(SB.cfg){SB.draft.url=SB.cfg.url;SB.draft.key=SB.cfg.key}SB.cfg=null;SB.client=null;SB.status="off";SB.err="";setMode();render()}
  else if(act==="migrate"){const lc=S.localCache;for(const coll of ["trades","days","reviews","beliefs"]){for(const [k,v] of Object.entries(lc[coll]||{}))await put(coll,k,v)}if(lc.settings)await saveSettings(lc.settings);toast("Шилжүүллээ")}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sbPass"){e.preventDefault();const b=$("[data-act=sbIn]");if(b)b.click();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-edit]")){e.preventDefault();openForm(e.target.dataset.edit)}});
function collectSettings(){const s=clone(S.settings);const g=id=>{const el=$("#"+id);return el?el.value:null};
  if(g("sCur")!=null){s.currency=g("sCur")||"$";s.startBalance=num(g("sBal"))??0;s.riskPct=num(g("sRisk"))??1;s.maxRiskPct=num(g("sMaxRisk"))??2;s.dailyLossPct=num(g("sDaily"))??3;s.maxTradesDay=num(g("sMaxT"))??5;
    s.setups=g("sSetups").split("\n").map(x=>x.trim()).filter(Boolean);
    s.instruments=$$("[data-inst]").map(row=>{const o={};$$("[data-k]",row).forEach(el=>{if(el.tagName==="INPUT")o[el.dataset.k]=el.type==="number"?(num(el.value)??0):el.value.trim()});o.kind=/step/i.test(o.name)?"step":/xau|gold|алт/i.test(o.name)?"gold":"other";return o}).filter(i=>i.name)}
  return s}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.draft;if(k)SB.draft[k]=e.target.value});
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(f)importJson(f);e.target.value=""});
$("#tradeForm").addEventListener("input",updatePreview);
$("#tradeForm").addEventListener("change",updatePreview);
$("#tradeForm").addEventListener("submit",e=>{e.preventDefault();submitForm()});
$("#dlg").addEventListener("close",()=>{editing=null});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.id==="fInst"){S.filter.inst=el.value;doRender()}else if(el.id==="fMonth"){S.filter.month=el.value;doRender()}else if(el.id==="fRes"){S.filter.res=el.value;doRender()}
  else if(el.dataset.daynote){const today=ymd(new Date());const d=clone(S.days[today]||{a:{}});d.note=el.value;await put("days",today,d)}
  else if(el.dataset.review!=null){const k=S.week;const r=clone(S.reviews[k]||{a:{}});r.a=r.a||{};r.a["q"+el.dataset.review]=el.value;await put("reviews",k,r)}
  else if(el.dataset.belief!=null){const k=S.month;const r=clone(S.beliefs[k]||{a:{}});r.a=r.a||{};r.a["q"+el.dataset.belief]=el.value;await put("beliefs",k,r)}
});
document.addEventListener("focusout",()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!$("#app").contains(a)||!(a.tagName==="TEXTAREA"||a.tagName==="INPUT"))render()},0)});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==="dash")render()},200)});

setMode();doRender();connect();
})();
</script>

</body>
</html>
