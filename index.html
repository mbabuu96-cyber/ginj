<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Алхам">
<meta name="description" content="Deriv Step Index ба XAUUSD-д зориулсан арилжааны тэмдэглэл.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='7' fill='%2316201B'/%3E%3Cpath d='M6 22h5v-5h5v-5h5V7h3' fill='none' stroke='%23D3A94B' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Алхам арилжааны тэмдэглэл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: багажны самбар — наалдсан толгой ба табууд, доор нь 12 баганат сүлжээ; утсан дээр нэг багана */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#E4E9E6; --ink:#16201B; --muted:#5A6A62; --line:#D0D8D3;
  --accent:#8E6A17; --accent-soft:#F1E7CF; --accent-ink:#FFFFFF;
  --gain:#1C7449; --gain-soft:#D7EEDF; --loss:#B13636; --loss-soft:#F6DCDC; --warn:#A8670F; --warn-soft:#F7E6CC;
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EBE7; --muted:#92A29A; --line:#28342F;
  --accent:#D3A94B; --accent-soft:#3A3020; --accent-ink:#1A1406;
  --gain:#4FC48C; --gain-soft:#173326; --loss:#F07C7C; --loss-soft:#3A1E1E; --warn:#E6B45C; --warn-soft:#3A2D17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EBE7; --muted:#92A29A; --line:#28342F;
  --accent:#D3A94B; --accent-soft:#3A3020; --accent-ink:#1A1406;
  --gain:#4FC48C; --gain-soft:#173326; --loss:#F07C7C; --loss-soft:#3A1E1E; --warn:#E6B45C; --warn-soft:#3A2D17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--gain)} .neg{color:var(--loss)} .muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.mode{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 11px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{margin-right:auto}

/* banner */
.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid}
.banner.demo{background:var(--accent-soft);border-color:var(--accent);}
.banner.stop{background:var(--loss-soft);border-color:var(--loss);color:var(--ink)}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.banner p{margin:0;flex:1;min-width:220px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--gain-soft);color:var(--gain)} .pill.bad{background:var(--loss-soft);color:var(--loss)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.dir{font-family:var(--f-mono);font-size:12px;font-weight:600}
.dir.buy{color:var(--gain)} .dir.sell{color:var(--loss)}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 76px;gap:10px;align-items:center;font-size:13px}
.bar .t{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.bar .t i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .t .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);left:50%}
.bar .n{text-align:right}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{border-radius:6px;min-height:58px;padding:5px 6px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:space-between;font-size:11px;min-width:0}
.cal .d.out{opacity:.35}
.cal .d .dn{color:var(--muted)}
.cal .d .dp{font-family:var(--f-mono);font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:520px){.cal .d{min-height:44px;padding:3px}.cal .d .dp{font-size:9px}}

/* forms */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,12,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin-right:auto;font-family:var(--f-display);font-size:15px;font-weight:500}
.dlg-b{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.dlg-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dlg-f .sp{margin-right:auto}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{padding:0;margin-bottom:8px}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
@media (max-width:700px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w2{grid-column:span 2} .f.w4{grid-column:1/-1}
.f label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=datetime-local],input[type=url],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=number]{font-family:var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--bg);padding:7px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg.yn button[data-v="y"][aria-pressed="true"]{background:var(--gain);color:#fff}
.seg.yn button[data-v="n"][aria-pressed="true"]{background:var(--loss);color:#fff}
.seg.yn.rev button[data-v="y"][aria-pressed="true"]{background:var(--loss);color:#fff}
.seg.yn.rev button[data-v="n"][aria-pressed="true"]{background:var(--gain);color:#fff}
.seg.bs button[data-v="Buy"][aria-pressed="true"]{background:var(--gain);color:#fff}
.seg.bs button[data-v="Sell"][aria-pressed="true"]{background:var(--loss);color:#fff}
.qrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:0}
.qrow span{flex:1;min-width:200px}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
@media (max-width:700px){.preview{grid-template-columns:repeat(2,minmax(0,1fr))}}
.preview div{display:flex;flex-direction:column;min-width:0}
.preview b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.warns{display:flex;flex-direction:column;gap:6px}
.warns div{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.warns div.bad{background:var(--loss-soft);color:var(--loss)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* 20 trade dots */
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dot.ok{border:0;background:var(--gain);color:#fff}
.dot.okl{border:0;background:var(--accent);color:var(--accent-ink)}
.bigstat{font-family:var(--f-display);font-size:34px;font-weight:700}

.principle{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:13px}
.principle b.lab{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;max-width:calc(100vw - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--loss-soft);padding:8px 10px;border-radius:8px;font-size:13px}
svg text{font-family:var(--f-mono)}
.inst-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:6px;align-items:end}
@media (max-width:700px){.inst-row{grid-template-columns:1fr 1fr 1fr}}
/* chart */
#chartRoot{max-width:1800px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.ch-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch-bar select{width:auto}
.ch-status{font-size:12px;color:var(--muted);margin-left:auto}
.ch-status.bad{color:var(--loss)}
.ch-replay{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.ch-replay input,.ch-replay select{width:auto}
.ch-wrap{position:relative;height:clamp(440px,calc(100vh - 300px),1600px);border:1px solid var(--tv-border,#E0E3EB);border-radius:4px;overflow:hidden;background:var(--tv-bg,#fff);--tv-ink:#131722;--tv-hover:#F0F3FA;--tv-blue:#2962FF;--tv-blue-soft:#E3EFFD;--tv-border:#E0E3EB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ch-wrap{--tv-ink:#D1D4DC;--tv-hover:#2A2E39;--tv-blue-soft:#142E61;--tv-border:#2A2E39;--tv-bg:#131722}}
:root[data-theme="dark"] .ch-wrap{--tv-ink:#D1D4DC;--tv-hover:#2A2E39;--tv-blue-soft:#142E61;--tv-border:#2A2E39;--tv-bg:#131722}
@media (max-width:700px){.ch-wrap{height:clamp(360px,72vh,900px)}}
#chartRoot.wide #chPanel{grid-column:span 12}
#chartRoot.wide #opPanel{display:none}
#chPanel:fullscreen{background:var(--bg);padding:12px;border-radius:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
#chPanel:fullscreen .ch-wrap{flex:1;height:auto;min-height:300px}
#chPanel:-webkit-full-screen{background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
#chPanel:-webkit-full-screen .ch-wrap{flex:1;height:auto}
.ch-view{display:flex;gap:6px;margin-left:auto}
.ch-view+.ch-status{margin-left:0;flex-basis:100%;text-align:right}
.ch-wrap.picking,.ch-wrap.drawing{cursor:crosshair}
.ch-wrap.drawing{touch-action:none}
#chDraw{position:absolute;top:0;left:40px;z-index:3;pointer-events:none}
.ch-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch-tools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.ch-tools select{width:auto}
.swatches{display:flex;gap:4px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
#chChart{position:absolute;top:0;right:0;bottom:0;left:40px}
.dt-bar{position:absolute;top:0;left:0;bottom:0;width:40px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-right:1px solid var(--tv-border);background:var(--tv-bg,#fff);overflow-y:auto;scrollbar-width:thin}
.dt-bar::-webkit-scrollbar{width:3px}.dt-bar::-webkit-scrollbar-thumb{background:var(--line)}
.dt-bar button{width:32px;height:30px;flex:none;display:grid;place-items:center;border:0;border-radius:4px;background:none;color:var(--tv-ink);cursor:pointer}
.dt-bar button:hover{background:var(--tv-hover)}
.dt-bar button[aria-pressed="true"]{background:var(--tv-blue-soft);color:var(--tv-blue)}
.dt-bar button.confirm{background:var(--loss-soft);color:var(--loss)}
.dt-bar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dt-bar .sep{width:22px;height:1px;background:var(--tv-border);margin:3px 0;flex:none}
.dt-bar svg{width:18px;height:18px;stroke-width:1.4}
.dt-props{position:absolute;top:6px;left:48px;z-index:7;display:flex;gap:4px;align-items:center;flex-wrap:nowrap;max-width:calc(100% - 130px);overflow-x:auto;scrollbar-width:none;background:var(--tv-bg,#fff);border:1px solid var(--tv-border);border-radius:6px;padding:3px 5px;box-shadow:0 2px 8px rgba(19,23,34,.12)}
.dt-props::-webkit-scrollbar{display:none}
.dt-props>*{flex:none}
.dt-props .seg button{padding:2px 7px;font-size:11px}
.dt-props .btn.sm{padding:2px 7px;font-size:11px;border-radius:6px}
.dt-props .swatches button{width:16px;height:16px}
.mtf-check{font-size:12px;color:var(--muted)}.mtf-check.good{color:var(--gain)}.mtf-check.bad{color:var(--warn)}
.pat-box{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.pat-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.pat-grid{grid-template-columns:1fr}}
.pat-chart,.pat-side{min-width:0;display:flex;flex-direction:column;gap:8px}
.pat-bar{display:flex;height:30px;border-radius:7px;overflow:hidden;font-weight:600;font-size:13px}
.pat-bar.base{height:18px;font-size:11px;opacity:.75}
.pat-bar .pb{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.pat-bar .buy{background:var(--gain)}.pat-bar .sell{background:var(--loss)}
.pat-tabs button{font-weight:600}
.np-explain{font-size:12px;margin:0}
.np-groups{align-self:flex-start;flex-wrap:wrap}
.np-base{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:10px;align-items:center;font-size:12px}
.np-bar{display:flex;height:20px;border-radius:5px;overflow:hidden;font-weight:600;font-size:11px;background:var(--surface-2)}
.np-bar.big{height:28px;font-size:13px}.np-bar.nil{justify-content:center;align-items:center;color:var(--muted);font-weight:400;font-size:11px}
.np-bar .pb{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.np-bar .buy{background:#089981}.np-bar .sell{background:#F23645}
.np-dir{font-size:11px;font-weight:700;white-space:nowrap}.np-dir.up{color:#089981}.np-dir.dn{color:#F23645}
.np-now{display:flex;flex-direction:column;gap:6px}
.np-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.np-card{display:flex;flex-direction:column;gap:5px;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font:inherit}
.np-card:hover{border-color:#2962FF}.np-card.now{border-left:3px solid #2962FF}.np-card.form{border-left:3px dashed #FF9800}
.np-card-h{display:flex;gap:8px;align-items:center;font-size:13px}
.np-tw{max-height:420px;overflow-y:auto}
.np-table tr.on td{background:color-mix(in srgb,#2962FF 9%,transparent)}
.np-table tr.dim td{opacity:.55}

function put(coll,id,obj){S[coll]=Object.assign({},S[coll],{[id]:obj});render();

async function initSupa(){

  if(/type=recovery/.test(linkInfo))SB.recovery=true;
  const linkErr=(linkInfo.match(/error_description=([^&]+)/)||[])[1];
  try{await loadScript(SUPA_LIB);
    SB.client=window.supabase.createClient(SB.cfg.url,SB.cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"alkham-auth"}});
    SB.client.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;const prev=SB.user&&SB.user.id;SB.user=u;
      if(ev==="PASSWORD_RECOVERY"){SB.recovery=true;SB.err="";S.view="settings";setTimeout(render,0)}
      if((u&&u.id)!==prev){setTimeout(()=>{u?enterSupa():leaveSupa(prev)},0)}});
    const {data}=await SB.client.auth.getSession();
    SB.user=data&&data.session?data.session.user:null;
    if(linkErr){SB.err="Имэйлийн холбоос хүчингүй эсвэл хугацаа нь дууссан байна. Нууц үг мартсан товчоор шинэ холбоос авна уу.";SB.raw=decodeURIComponent(linkErr.replace(/\+/g," "));SB.recovery=false;S.view="settings"}
    if(SB.recovery&&SB.user)S.view="settings";
    if(/access_token|type=recovery|error_description/.test(location.hash))try{history.replaceState(null,"",location.pathname)}catch(e){}
    if(SB.user)await enterSupa();else{SB.status="signedout";setMode();render()}
  }catch(e){SB.status="error";SB.err=supaMsg(e);setMode();render()}
}

      const dw={};rows.forEach(r=>{if(r.coll==="settings"){if(r.id==="prefs:ui"){S.prefs=r.data||{};try{localStorage.setItem("alkham-ui-prefs",JSON.stringify(S.prefs))}catch(e){}}else if(r.id==="main")st=r.data;else if(String(r.id).startsWith("draw:"))dw[String(r.id).slice(5)]=(r.data&&r.data.items)||[]}else if(m[r.coll])m[r.coll][r.id]=r.data});

async function sendOp(op){

    :await q.upsert({user_id:SB.user.id,coll:op.coll,id:op.id,data:op.data,updated_at:new Date().toISOString()},{onConflict:"user_id,coll,id"});
  if(res.error)throw res.error;
}
let flushing=null;
function flushPending(){if(flushing)return flushing;

    while(q.length&&S.mode==="supa"&&SB.user){const op=q[0];
      if(op.u!==SB.user.id){q.shift();pendingSet(q);continue}
      try{await sendOp(op);q=pendingGet();if(q.length&&q[0].coll===op.coll&&q[0].id===op.id&&q[0].ts===op.ts)q.shift();pendingSet(q)}
      catch(e){SB.status="offline";SB.err=supaMsg(e);break}}
    if(!pendingGet().length&&SB.status==="offline"){SB.status="ok";SB.err=""}
    setMode()})().finally(()=>{flushing=null});
  return flushing}

  q.push(op);pendingSet(q);cacheSave();setMode();

async function connect(){
  if(!window.claude||typeof window.claude.use!=="function"){initSupa();return}
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!user||!db){setMode();return}
    const id=await user.id();if(!id){setMode();return}
    BASE=db.doc(`data/users/${id}/journal`);SETDOC=db.doc(`data/users/${id}/settings`);
    S.mode="cloud";S.trades={};S.days={};S.reviews={};S.beliefs={};S.cloudLoaded=false;
    ["trades","days","reviews","beliefs"].forEach(name=>{
      BASE.collection(name).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S[name]=m;if(name==="trades")S.cloudLoaded=true;render()},
        err=>{handleErr(err)});
    });
    SETDOC.onSnapshot(d=>{if(d.exists)S.settings=mergeSettings(clone(d.data()));render()},err=>handleErr(err));
    setMode();render();
  }catch(e){setMode()}
}

/* ---------------- calculations ---------------- */
function instOf(name){return S.settings.instruments.find(i=>i.name===name)||{name:name||"?",cs:1,minLot:0.01,lotStep:0.01,tick:0.01,kind:"other"}}
function sessionOf(t,ins){if(ins.kind==="step")return "24/7";if(!t.open)return "—";const d=new Date(t.open);if(isNaN(d))return "—";const h=d.getUTCHours();
  if(h>=12&&h<16)return "Лондон+NY";if(h>=7&&h<12)return "Лондон";if(h>=16&&h<21)return "Нью-Йорк";return "Ази"}
function calc(t){
  const ins=instOf(t.inst),cs=+ins.cs||1,dir=t.dir==="Sell"?-1:1;
  const e=num(t.entry),sl=num(t.sl),tp=num(t.tp),x=num(t.exit),lots=num(t.lots),fees=num(t.fees)||0;
  const risk=(e!=null&&sl!=null&&lots!=null&&e!==sl)?Math.abs(e-sl)*lots*cs:null;
  let pnl=null;const act=num(t.actual);
  if(act!=null)pnl=act;else if(e!=null&&x!=null&&lots!=null)pnl=(x-e)*dir*lots*cs+fees;
  const R=(pnl!=null&&risk)?pnl/risk:null;
  const bal=num(t.balance);const riskPct=(risk!=null&&bal)?risk/bal:null;
  const rr=(e!=null&&sl!=null&&tp!=null&&e!==sl)?Math.abs(tp-e)/Math.abs(e-sl):null;
  const steps=(e!=null&&sl!=null&&+ins.tick)?Math.round(Math.abs(e-sl)/ins.tick):null;
  const closed=pnl!=null;
  const quality=!closed||!t.followed?null:t.followed==="y"?(pnl>=0?"Сайн":"Сайн алдагдал"):(pnl>0?"Муу ашиг":"Муу");
  const when=t.close||t.open||"";
  return {ins,cs,risk,pnl,R,riskPct,rr,steps,closed,quality,session:sessionOf(t,ins),when,date:when.slice(0,10)};
}
function enriched(trades,mode){return Object.entries(trades).filter(([,t])=>mode==="all"?true:mode==="backtest"?t.kind==="backtest":t.kind!=="backtest").map(([id,t])=>Object.assign({id},t,{_:calc(t)})).sort((a,b)=>(a._.when<b._.when?-1:a._.when>b._.when?1:0))}
function stats(list){
  const closed=list.filter(t=>t._.closed);
  const wins=closed.filter(t=>t._.pnl>0),losses=closed.filter(t=>t._.pnl<0);
  const net=closed.reduce((a,t)=>a+t._.pnl,0);
  const gw=wins.reduce((a,t)=>a+t._.pnl,0),gl=Math.abs(losses.reduce((a,t)=>a+t._.pnl,0));
  const Rs=closed.filter(t=>t._.R!=null).map(t=>t._.R);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const fy=list.filter(t=>t.followed==="y").length,fn=list.filter(t=>t.followed==="n").length;
  return {n:closed.length,wins:wins.length,losses:losses.length,net,winRate:closed.length?wins.length/closed.length:null,
    pf:gl?gw/gl:(gw?Infinity:null),exp:avg(Rs),sumR:Rs.reduce((a,b)=>a+b,0),
    avgWinR:avg(Rs.filter(r=>r>0)),avgLossR:avg(Rs.filter(r=>r<0)),worstR:Rs.length?Math.min(...Rs):null,
    disc:(fy+fn)?fy/(fy+fn):null,fy,fn,
    moved:list.filter(t=>t.movedStop==="y").length,addL:list.filter(t=>t.addedLoser==="y").length,addW:list.filter(t=>t.addedWinner==="y").length,
    notAcc:list.filter(t=>t.accepted==="n").length,overRisk:list.filter(t=>t._.riskPct!=null&&t._.riskPct>S.settings.maxRiskPct/100).length,
    badWin:list.filter(t=>t._.quality==="Муу ашиг").length,fearExit:list.filter(t=>t.exitReason==="Айснаасаа").length,
    calm:avg(list.filter(t=>t.calm).map(t=>+t.calm))};
}
function groupBy(list,keyFn){const m=new Map();list.forEach(t=>{const k=keyFn(t);if(k==null||k==="")return;if(!m.has(k))m.set(k,[]);m.get(k).push(t)});return m}
function currentBalance(list){return (+S.settings.startBalance||0)+list.filter(t=>t._.closed).reduce((a,t)=>a+t._.pnl,0)}

/* ---------------- demo data (харуулах жишээ, хадгалагдахгүй) ---------------- */
function demoTrades(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const out={};const base=new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()-41);
  let bal=1000;
  for(let i=0;i<46;i++){
    const d=new Date(base);d.setDate(d.getDate()+Math.floor(i*0.9));
    const gold=rnd()<0.45;const inst=gold?"XAUUSD":(rnd()<0.6?"Step Index":"Step Index 200");
    const ins=instOf(inst);const hour=gold?[9,16,21,22][Math.floor(rnd()*4)]:Math.floor(rnd()*24);
    d.setHours(hour,Math.floor(rnd()*60));
    const dir=rnd()<0.5?"Buy":"Sell";const e=gold?+(2380+rnd()*80).toFixed(2):+(7000+rnd()*800).toFixed(1);
    const stopDist=gold?+(3+rnd()*4).toFixed(2):+(ins.tick*(20+Math.floor(rnd()*30))).toFixed(1);
    const lots=gold?Math.max(0.01,+((bal*0.01)/(stopDist*100)).toFixed(2)):Math.max(0.1,+((bal*0.01)/(stopDist*10)).toFixed(2));
    const sign=dir==="Buy"?1:-1;const emo=rnd()<0.62?"Тайван":EMOTIONS[1+Math.floor(rnd()*7)];
    const followed=emo==="Тайван"?(rnd()<0.9?"y":"n"):(rnd()<0.45?"y":"n");
    let r=rnd()<(followed==="y"?0.47:0.35)?(1+rnd()*2.2):-1;
    if(followed==="n"&&r<0&&rnd()<0.5)r=-1.4-rnd()*0.8;
    const exit=+(e+sign*r*stopDist).toFixed(gold?2:1);
    const close=new Date(d.getTime()+(20+rnd()*240)*6e4);
    const t={inst,dir,open:`${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`,close:`${ymd(close)}T${pad(close.getHours())}:${pad(close.getMinutes())}`,
      entry:e,sl:+(e-sign*stopDist).toFixed(gold?2:1),tp:+(e+sign*stopDist*2.5).toFixed(gold?2:1),exit,lots,fees:0,actual:"",balance:+bal.toFixed(2),
      setup:S.settings.setups[Math.floor(rnd()*S.settings.setups.length)],emotion:emo,
      exitReason:r>2?"Зорилтод хүрсэн":r>0?(rnd()<0.3?"Айснаасаа":"Дүрмээр гарсан"):"Stop-д хүрсэн",
      accepted:followed==="y"?"y":(rnd()<0.5?"n":"y"),movedStop:followed==="n"&&r<-1?"y":"n",addedLoser:followed==="n"&&rnd()<0.2?"y":"n",addedWinner:r>2&&rnd()<0.4?"y":"n",
      followed,exercise:i>=30?"y":"",calm:emo==="Тайван"?4+Math.round(rnd()):2+Math.round(rnd()),notes:"Жишээ арилжаа",chart:""};
    bal+=calc(t).pnl||0;out["demo"+i]=t;
  }
  return out;
}

/* ---------------- charts ---------------- */
function equitySVG(list,w){
  const closed=list.filter(t=>t._.closed);const start=+S.settings.startBalance||0;
  const pts=[start];closed.forEach(t=>pts.push(pts[pts.length-1]+t._.pnl));
  const H=220,L=58,R=12,T=14,B=26;w=Math.max(280,w);
  if(pts.length<2)return `<div class="empty">Хаагдсан арилжаа нэмэгдмэгц энд дансны өсөлтийн муруй гарна.</div>`;
  let min=Math.min(...pts),max=Math.max(...pts);if(min===max){min-=1;max+=1}const padv=(max-min)*0.08;min-=padv;max+=padv;
  const x=i=>L+(w-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  const ticks=4;let grid="";for(let k=0;k<=ticks;k++){const v=min+(max-min)*k/ticks;const yy=y(v);grid+=`<line x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(S.settings.currency)}${Math.round(v).toLocaleString("en-US")}</text>`}
  let d="";pts.forEach((v,i)=>{d+=(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});
  const area=d+`L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`;
  let peak=-Infinity,dd=0;pts.forEach(v=>{peak=Math.max(peak,v);dd=Math.max(dd,peak-v)});
  const last=pts[pts.length-1],up=last>=start;const col=up?"var(--gain)":"var(--loss)";
  const xl=[0,Math.floor((pts.length-1)/2),pts.length-1].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="10" fill="var(--muted)">#${i}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${H}" width="100%" height="${H}" role="img" aria-label="Дансны өсөлтийн муруй">
    ${grid}<line x1="${L}" x2="${w-R}" y1="${y(start)}" y2="${y(start)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
    <path d="${area}" fill="${col}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last)}" r="4" fill="${col}"/>${xl}</svg>
    <div class="muted" style="font-size:12px">Эхлэл ${money(start).replace("+","")} → одоо <span class="num ${cls(last-start)}">${money(last).replace("+","")}</span> · Хамгийн их уналт <span class="num neg">${S.settings.currency}${fm(dd)}</span></div>`;
}
function barsHTML(rows,valFmt){
  if(!rows.length)return `<div class="muted">Өгөгдөл алга.</div>`;
  const mx=Math.max(...rows.map(r=>Math.abs(r.v)),0.0001);
  return `<div class="bars">${rows.map(r=>{const w=Math.abs(r.v)/mx*50;const left=r.v>=0?50:50-w;
    return `<div class="bar"><span title="${esc(r.k)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.k)} <span class="muted">(${r.n})</span></span><div class="t"><i style="left:${left}%;width:${w}%;background:${r.v>=0?"var(--gain)":"var(--loss)"}"></i><span class="zero"></span></div><span class="n num ${cls(r.v)}">${valFmt(r.v)}</span></div>`}).join("")}</div>`;
}

/* ---------------- views ---------------- */
function kpi(label,val,sub,extra=""){return `<div class="kpi"><span class="eyebrow">${label}</span><span class="v">${val}</span>${extra}<span class="s">${sub}</span></div>`}

    ${kpi("Хожлын хувь",pct(st.winRate),`${st.wins} ашиг · ${st.losses} алдагдал`)}

  const emo=groupBy(list.filter(t=>t._.R!=null),t=>t.emotion);let worst=null;emo.forEach((a,k)=>{const s=a.reduce((x,t)=>x+t._.R,0);if(!worst||s<worst.v)worst={k,v:s}});
  if(worst&&worst.v<0)ins.push(`Хамгийн их зардал гаргасан мэдрэмж: <b>${esc(worst.k)}</b> (<span class="num neg">${rfmt(worst.v)}</span>).`);
  if(st.avgLossR!=null&&st.avgLossR<-1.15)ins.push(`Дундаж алдагдал <b class="num neg">${rfmt(st.avgLossR)}</b>: −1R-ээс их байна. Stop-оо хүндэтгэхгүй байгаа дохио.`);

  for(let i=0;i<42;i++){const dn=i-off+1;if(i>=35&&dn>daysIn)break;
    if(dn<1||dn>daysIn){cal+=`<div class="d out"></div>`;continue}
    const key=`${cy}-${pad(cm)}-${pad(dn)}`;const a=byDay.get(key);let style="",inner="";

  const monthName=["1-р сар","2-р сар","3-р сар","4-р сар","5-р сар","6-р сар","7-р сар","8-р сар","9-р сар","10-р сар","11-р сар","12-р сар"][cm-1];

  const instRows=[];groupBy(list.filter(t=>t._.closed),t=>t.inst).forEach((a,k)=>{const s=stats(a);instRows.push({k,s})});
  instRows.sort((a,b)=>b.s.net-a.s.net);
  const sesRows=[];groupBy(list.filter(t=>t._.R!=null),t=>t._.session).forEach((a,k)=>sesRows.push({k,n:a.length,v:a.reduce((x,t)=>x+t._.R,0)}));
  const emoRows=[];emo.forEach((a,k)=>emoRows.push({k,n:a.length,v:a.reduce((x,t)=>x+t._.R,0)}));emoRows.sort((a,b)=>b.v-a.v);
  const setRows=[];groupBy(list.filter(t=>t._.R!=null),t=>t.setup).forEach((a,k)=>setRows.push({k,n:a.length,v:a.reduce((x,t)=>x+t._.R,0)}));setRows.sort((a,b)=>b.v-a.v);
  const hourRows=[];const hb=["00–04","04–08","08–12","12–16","16–20","20–24"];groupBy(list.filter(t=>t._.R!=null&&t.open),t=>hb[Math.floor(new Date(t.open).getHours()/4)]).forEach((a,k)=>hourRows.push({k,n:a.length,v:a.reduce((x,t)=>x+t._.R,0)}));hourRows.sort((a,b)=>a.k<b.k?-1:1);

  const mist=[["Stop-ийг алдагдал руу хөдөлгөсөн",st.moved,0],["Алдагдалтай позицид нэмсэн",st.addL,0],["Эрсдэлийг урьдчилан хүлээн зөвшөөрөөгүй",st.notAcc,0],[`Эрсдэл ${S.settings.maxRiskPct}%-иас давсан`,st.overRisk,0],["Дүрэм зөрчөөд ашиг олсон",st.badWin,0],["Айснаасаа эрт гарсан",st.fearExit,0]];

  h+=`<div class="grid">
    <section class="panel c7"><div class="panel-h"><h2>Дансны өсөлт</h2><span class="muted" style="font-size:12px">арилжаа тус бүрээр</span></div>${equitySVG(list,w)}</section>
    <section class="panel c5"><div class="panel-h"><h2>Ажиглалт</h2></div>
      ${ins.length?ins.map(s=>`<div class="principle">${s}</div>`).join(""):`<div class="muted">10-аас дээш арилжааны дараа энд зан үйлийн хэв маяг гарч ирнэ.</div>`}
      <div class="principle"><b class="lab">Санамж</b>${esc(PRINCIPLES[new Date().getDate()%PRINCIPLES.length][1])}</div>
    </section>
    <section class="panel c7"><div class="panel-h"><h2>${monthName} ${cy}</h2><span class="num ${cls(monthNet)}">${money(monthNet)}</span>
      <button class="btn sm" data-act="calPrev" aria-label="Өмнөх сар">‹</button><button class="btn sm" data-act="calNext" aria-label="Дараах сар">›</button></div>
      <div class="cal">${cal}</div></section>
    <section class="panel c5"><div class="panel-h"><h2>Сахилгын алдаа</h2><span class="muted" style="font-size:12px">зорилт: бүгд 0</span></div>
      <div class="tw"><table><tbody>${mist.map(m=>`<tr><td>${m[0]}</td><td class="r"><span class="pill ${m[1]?"bad":"good"}">${m[1]}</span></td></tr>`).join("")}
      <tr><td>Ашигтай позицид нэмсэн (зөв нэмэлт)</td><td class="r"><span class="pill neutral">${st.addW}</span></td></tr>
      <tr><td>Дундаж тайван байдал</td><td class="r num">${st.calm==null?"—":st.calm.toFixed(1)+" / 5"}</td></tr></tbody></table></div></section>
    <section class="panel c12"><div class="panel-h"><h2>Хэрэгслээр</h2></div>
      <div class="tw"><table><thead><tr><th>Хэрэгсэл</th><th class="r">Арилжаа</th><th class="r">Хожил %</th><th class="r">Цэвэр</th><th class="r">Нийт R</th><th class="r">Дундаж R</th><th class="r">Сахилга</th></tr></thead><tbody>
      ${instRows.length?instRows.map(r=>`<tr><td>${esc(r.k)}</td><td class="r num">${r.s.n}</td><td class="r num">${pct(r.s.winRate)}</td><td class="r num ${cls(r.s.net)}">${money(r.s.net)}</td><td class="r num ${cls(r.s.sumR)}">${rfmt(r.s.sumR)}</td><td class="r num ${cls(r.s.exp)}">${rfmt(r.s.exp)}</td><td class="r num">${pct(r.s.disc)}</td></tr>`).join(""):`<tr><td colspan="7" class="muted">Хаагдсан арилжаа алга.</td></tr>`}

  </div>`;
  return h;
}

    (f.res==="all"||(f.res==="win"&&t._.pnl>0)||(f.res==="loss"&&t._.pnl<0)||(f.res==="open"&&!t._.closed)||(f.res==="bad"&&t.followed==="n")||f.res==="backtest"));

    <div class="filters">
      <select id="fInst" aria-label="Хэрэгсэл">${opt("all","Бүх хэрэгсэл",f.inst)}${S.settings.instruments.map(i=>opt(i.name,i.name,f.inst)).join("")}</select>
      <select id="fMonth" aria-label="Сар">${opt("all","Бүх сар",f.month)}${months.map(m=>opt(m,m,f.month)).join("")}</select>
      <select id="fRes" aria-label="Үр дүн">${opt("all","Бүгд",f.res)}${opt("win","Ашигтай",f.res)}${opt("loss","Алдагдалтай",f.res)}${opt("open","Нээлттэй",f.res)}${opt("bad","Дүрэм зөрчсөн",f.res)}${opt("backtest","Давтан тоглуулалт (backtest)",f.res)}</select>

    ${list.length?`<div class="tw"><table><thead><tr><th>Огноо</th><th>Хэрэгсэл</th><th>Чиглэл</th><th class="r">Лот</th><th class="r">Орох</th><th class="r">Гарах</th><th class="r">Эрсдэл</th><th class="r">P/L</th><th class="r">R</th><th>Мэдрэмж</th><th>Чанар</th><th>Setup</th></tr></thead><tbody>
    ${list.map(t=>{const c=t._;const q=c.quality;const qc=q==="Сайн"||q==="Сайн алдагдал"?"good":q?"bad":"neutral";
      return `<tr class="click" data-edit="${esc(t.id)}" tabindex="0"><td class="num">${esc((t.open||"").replace("T"," "))}</td><td>${esc(t.inst)}</td><td><span class="dir ${t.dir==="Sell"?"sell":"buy"}">${esc(t.dir||"")}</span></td>

      <td class="r num">${c.riskPct==null?"—":`<span class="${c.riskPct>S.settings.maxRiskPct/100?"neg":""}">${(c.riskPct*100).toFixed(2)}%</span>`}</td>

function viewEx(){

/* --- Deriv WebSocket --- */
const DV={ws:null,open:null,id:0,wait:new Map(),stream:new Map(),symbols:null,retry:0};
function dvTryOpen(url){return new Promise((res,rej)=>{let ws,done=false;try{ws=new WebSocket(url)}catch(e){return rej(e)}
  const to=setTimeout(()=>{if(done)return;done=true;try{ws.close()}catch(e){}rej(new Error("timeout"))},8000);
  ws.onopen=()=>{if(done)return;done=true;clearTimeout(to);res(ws)};
  ws.onerror=()=>{};
  ws.onclose=()=>{if(done)return;done=true;clearTimeout(to);rej(new Error("closed"))}})}
function dvConnect(){
  if(DV.open)return DV.open;
  DV.open=(async()=>{
    let pref=null;try{pref=localStorage.getItem("alkham-deriv-url")}catch(e){}
    const urls=pref&&DERIV_WS_LIST.includes(pref)?[pref].concat(DERIV_WS_LIST.filter(u=>u!==pref)):DERIV_WS_LIST;
    let ws=null,lastErr=null;
    for(const u of urls){try{ws=await dvTryOpen(u);DV.url=u;try{localStorage.setItem("alkham-deriv-url",u)}catch(e){}break}catch(e){lastErr=e}}
    if(!ws){DV.open=null;throw lastErr||new Error("closed")}
    DV.ws=ws;DV.retry=0;

async function derivSymbol(ins){
  if(ins.deriv)return ins.deriv;
  const list=await dvSymbols();

    const n=+((ins.name.match(/(\d{3})/)||[])[1]||Math.round((+ins.tick||0.1)*1000))||100;
    const hit=list.find(s=>/step/i.test(s.display_name)&&(+((s.display_name.match(/(\d{3})/)||[])[1]||100))===n);
    return hit?hit.symbol:(STEP_FALLBACK[n]||"stpRNG")}
  if(ins.kind==="gold"||/xau|gold/i.test(ins.name)){const hit=list.find(s=>s.symbol==="frxXAUUSD")||list.find(s=>/gold\/usd/i.test(s.display_name));return hit?hit.symbol:"frxXAUUSD"}
  const key=ins.name.toLowerCase().replace(/[^a-z0-9]/g,"");
  const hit=list.find(s=>s.display_name.toLowerCase()===ins.name.toLowerCase()||s.symbol.toLowerCase().replace(/[^a-z0-9]/g,"").endsWith(key));

  let bs=6;try{bs=+localStorage.getItem("alkham-chart-bs")||6}catch(e){}CH.bs=Math.max(1,Math.min(60,bs));
  CH.chart=LW.createChart($("#chChart"),{autoSize:true,timeScale:{timeVisible:true,secondsVisible:false,rightOffset:8,barSpacing:CH.bs,minBarSpacing:0.5},crosshair:{mode:0},localization:{locale:"en-US"}});

  if(CH.inst){const d=decOf(CH.inst);CH.series.applyOptions({priceFormat:{type:"price",precision:d,minMove:+(10**-d).toFixed(d)}})}
  chTheme();
  CH.chart.subscribeClick(p=>{if(!CH.pick||!p.point)return;const price=CH.series.coordinateToPrice(p.point.y);if(price==null)return;
    $(CH.pick==="sl"?"#opSl":"#opTp").value=fmtP(price);CH.pick=null;$("#chHint").hidden=true;$("#chWrap").classList.remove("picking");chUpdate()});
  CH.chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{chZones();if(r&&r.from<60)chOlder()});
  new ResizeObserver(()=>chZones()).observe($("#chWrap"));

  new MutationObserver(()=>setTimeout(chTheme,50)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  return true;

/* --- хуучин түүхийг зүүн тийш гүйлгэхэд ачаалах --- */
const MAX_BARS=60000;
async function chOlder(){
  if(CH.olderBusy||!CH.sym||!CH.series)return;const replay=CH.mode==="replay";
  const data=replay?CH.rp.all:CH.series.data();if(!data.length||data.length>=MAX_BARS)return;
  const key=(replay?"r":"l")+CH.sym+CH.gran+data[0].time;if(CH.olderDone===key)return;
  CH.olderBusy=true;const seq=CH.loadSeq;const firstEp=data[0].time-TZ;chStatus("Хуучин лаа ачаалж байна…");
  try{const r=await dvSend({ticks_history:replay?CH.rp.sym:CH.sym,style:"candles",granularity:CH.gran,end:firstEp-1,count:5000,adjust_start_time:1});
    if(seq!==CH.loadSeq)return;
    const add=(r.candles||[]).map(toBar).filter(b=>b.time<data[0].time);
    if(!add.length){CH.olderDone=key;chStatus("Энэ хэрэгслийн хамгийн эхний өгөгдөлд хүрлээ.");return}
    const ts=CH.chart.timeScale(),vr=ts.getVisibleLogicalRange();
    if(replay){CH.rp.all=add.concat(CH.rp.all);CH.rp.idx+=add.length;CH.series.setData(CH.rp.all.slice(0,CH.rp.idx))}
    else CH.series.setData(add.concat(CH.series.data()));
    if(vr)ts.setVisibleLogicalRange({from:vr.from+add.length,to:vr.to+add.length});
    if(!replay){MTF.key="";mtfLoadReal()}
    chStatus(`${replay?"Давтан тоглуулах":"Шууд"} · ${CH.sym} · ${(replay?CH.rp.idx:CH.series.data().length).toLocaleString("en-US")} лаа`);drDirty();
  }catch(e){chStatus(dvErrMsg(e),true)}finally{CH.olderBusy=false}}
/* --- live --- */
async function chLoadLive(){
  const seq=++CH.loadSeq;rpPause();await chForget();if(seq!==CH.loadSeq||!CH.active)return;
  const ins=CH.inst;chStatus("Ачаалж байна…");if(!CH.series.data().length)chEmpty("График ачаалж байна…");
  try{const sym=await derivSymbol(ins);if(!sym)throw {code:"InvalidSymbol"};CH.sym=sym;
    const g=CH.gran;
    const onBar=m=>{if(CH.mode!=="live"||seq!==CH.loadSeq)return;let bar;
      if(m.ohlc){const o=m.ohlc;const ot=o.open_time!=null?+o.open_time:Math.floor(+(o.epoch||Date.now()/1000)/g)*g;
        bar={time:ot+TZ,open:+o.open,high:+o.high,low:+o.low,close:+o.close}}
      else if(m.tick){const q=+m.tick.quote,t=Math.floor(+m.tick.epoch/g)*g+TZ;const data=CH.series.data();const lb=data.length?data[data.length-1]:null;
        bar=lb&&lb.time===t?{time:t,open:lb.open,high:Math.max(lb.high,q),low:Math.min(lb.low,q),close:q}:{time:t,open:q,high:q,low:q,close:q}}
      if(!bar||!isFinite(bar.close))return;
      try{CH.series.update(bar)}catch(e){}CH.last=bar.close;CH.lastTime=bar.time;chUpdate(true)};
    const req={ticks_history:sym,style:"candles",granularity:CH.gran,count:5000,end:"latest",adjust_start_time:1};
    let r,closed=false;
    try{r=await dvSend(Object.assign({subscribe:1},req),onBar)}catch(e){if(e&&e.code==="MarketIsClosed"){closed=true;r=await dvSend(req)}else throw e}
    if(seq!==CH.loadSeq)return;
    CH.subId=r.subscription&&r.subscription.id;
    const bars=(r.candles||[]).map(toBar);CH.series.setData(bars);CH.series.setMarkers([]);
    CH.last=bars.length?bars[bars.length-1].close:null;CH.lastTime=bars.length?bars[bars.length-1].time:null;
    CH.chart.timeScale().scrollToRealTime();chEmpty(bars.length?"":"Энэ хэрэгсэлд өгөгдөл ирсэнгүй.");
    MTF.key="";mtfLoadReal();
    chStatus(closed?"Зах зээл хаалттай · сүүлийн өгөгдөл":`Шууд · ${sym} · ${bars.length.toLocaleString("en-US")} лаа${DV.url&&!/options\/ws\/public/.test(DV.url)?" · нөөц сервер":""}`,closed);chUpdate(true);
  }catch(e){if(seq!==CH.loadSeq)return;chStatus(dvErrMsg(e),true);if(!CH.series.data().length)chEmpty(esc(dvErrMsg(e)))}
}

/* --- order calculation --- */
function chCalc(){
  const ins=CH.inst,cs=+ins.cs||1,step=+ins.lotStep||0.01,minLot=+ins.minLot||step;
  const replay=CH.mode==="replay",pos=replay&&CH.rp.pos;
  const entry=pos?pos.entry:(CH.mkt||replay)?CH.last:num($("#opEntry").value);
  const sl=num($("#opSl").value),tp=num($("#opTp").value),bal=chBalance(),riskPct=CH.risk||0;
  const o={ins,entry,sl,tp,bal,riskPct,riskAmt:bal*riskPct/100,dir:pos?pos.dir:CH.dir,warn:[]};
  if(entry==null){o.warn.push(["",replay?"Эхлээд түүхэн өгөгдлөө ачаална уу.":"Орох үнэ алга."]);return o}
  if(sl==null){o.warn.push(["bad","Stop-loss тавина уу. Сайн ялагдагч орохоосоо өмнө гарах цэгээ мэддэг."]);return o}
  const d=o.dir==="Sell"?-1:1;const dist=Math.abs(entry-sl);
  if(dist===0){o.warn.push(["bad","Stop-loss орох үнэтэй ижил байна."]);return o}
  if((sl-entry)*d>0)o.warn.push(["bad",`${o.dir} арилжаанд stop орох үнийн ${d>0?"доор":"дээр"} байх ёстой.`]);
  if(tp!=null&&(tp-entry)*d<0)o.warn.push(["bad",`${o.dir} арилжаанд зорилт орох үнийн ${d>0?"дээр":"доор"} байх ёстой.`]);
  o.dist=dist;o.steps=+ins.tick?Math.round(dist/ins.tick):null;
  let lots=pos?pos.lots:Math.floor(o.riskAmt/(dist*cs)/step+1e-9)*step;
  if(!pos&&lots<minLot){o.warn.push(["bad",`Тооцоолсон лот хамгийн бага лот (${minLot})-оос бага байна. ${minLot} лотоор орвол эрсдэл ${S.settings.currency}${fm(dist*cs*minLot)} (${fm(dist*cs*minLot/bal*100)}%) болно. Stop-оо ойртуулах эсвэл орохгүй байх нь дээр.`]);lots=minLot}
  o.lots=+lots.toFixed(4);o.risk=dist*cs*o.lots;o.riskReal=bal?o.risk/bal:null;
  if(tp!=null){o.rr=Math.abs(tp-entry)/dist;o.reward=Math.abs(tp-entry)*cs*o.lots}
  if(o.riskReal!=null&&o.riskReal>S.settings.maxRiskPct/100)o.warn.push(["bad",`Эрсдэл ${(o.riskReal*100).toFixed(2)}% нь таны дээд хязгаар ${S.settings.maxRiskPct}%-иас их байна.`]);
  if(o.rr!=null&&o.rr<1)o.warn.push(["","R:R 1-ээс бага байна. Ашиг алдагдлаасаа бага байх арилжаа урт хугацаанд хохиролтой."]);
  return o;
}

  const ent=$("#opEntry");if((CH.mkt||replay)&&document.activeElement!==ent)ent.value=CH.last==null?"":fmtP(CH.last);

  const cell=(l,v,c="")=>`<div><span class="lbl">${l}</span><b class="${c}">${v}</b></div>`;
  $("#opOut").innerHTML=cell("Лот",o.lots==null?"—":fm(o.lots,2))+cell("Бодит эрсдэл",o.risk==null?"—":`${S.settings.currency}${fm(o.risk)}`,o.riskReal>S.settings.maxRiskPct/100?"neg":"")
    +cell(ins.kind==="step"?"Stop хүртэл алхам":"Stop зай",o.steps==null?"—":(ins.kind==="step"?o.steps.toLocaleString("en-US"):fmtP(o.dist)))
    +cell("R:R",o.rr==null?"—":"1 : "+o.rr.toFixed(2))+cell("Боломжит ашиг",o.reward==null?"—":`${S.settings.currency}${fm(o.reward)}`,"pos")
    +cell("Орох үнэ",fmtP(o.entry));

  else{go.textContent="Тэмдэглэлд бүртгэх";go.dataset.ch="go";go.disabled=false}

  $$("#opDir button").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.v===(CH.rp.pos?CH.rp.pos.dir:CH.dir)));b.disabled=!!CH.rp.pos});
  chLines(o);rpRenderBox();rtUi();
}
let zoneRaf=0;
function chLines(o){
  if(!CH.series)return;
  if(CH.mode==="replay"){for(const k of Object.keys(CH.lines)){CH.series.removePriceLine(CH.lines[k]);delete CH.lines[k]}CH._zone=null;$("#zTp").hidden=$("#zSl").hidden=true;return}
  o=o||chCalc();
  const want={entry:o.entry!=null&&(o.sl!=null||CH.rp.pos)?o.entry:null,sl:o.sl,tp:o.tp};
  const col={entry:cssVar("--accent"),sl:cssVar("--loss"),tp:cssVar("--gain")},title={entry:"Орох",sl:"SL",tp:"TP"};
  for(const k of ["entry","sl","tp"]){const v=want[k];const L=CH.lines[k];
    if(v==null){if(L){CH.series.removePriceLine(L);delete CH.lines[k]}continue}
    if(L)L.applyOptions({price:v,color:col[k]});else CH.lines[k]=CH.series.createPriceLine({price:v,color:col[k],lineWidth:k==="entry"?2:1,lineStyle:k==="entry"?0:2,axisLabelVisible:true,title:title[k]})}
  CH._zone={entry:want.entry,sl:o.sl,tp:o.tp,time:CH.rp.pos?CH.rp.pos.time:CH.lastTime};chZones();
}
function chZones(){cancelAnimationFrame(zoneRaf);zoneRaf=requestAnimationFrame(()=>{
  const z=CH._zone,zt=$("#zTp"),zs=$("#zSl");if(!z||!CH.series||z.entry==null){zt.hidden=zs.hidden=true;return}
  const ts=CH.chart.timeScale();let x0=z.time!=null?ts.timeToCoordinate(z.time):null;const w=$("#chChart").clientWidth-CH.chart.priceScale("right").width();
  if(x0==null||x0<0)x0=Math.max(0,w-140);const ye=CH.series.priceToCoordinate(z.entry);
  const place=(el,p)=>{if(p==null||ye==null){el.hidden=true;return}const y=CH.series.priceToCoordinate(p);if(y==null){el.hidden=true;return}
    el.hidden=false;el.style.left=(x0+40)+"px";el.style.width=Math.max(0,w-x0)+"px";el.style.top=Math.min(y,ye)+"px";el.style.height=Math.abs(y-ye)+"px"};
  place(zt,z.tp);place(zs,z.sl)})}

/* --- replay (backtest) --- */
// Түүхэн лаа татах: Deriv-ийн лаа (end+count) → дутуу бол тикээс 1м/5м лаа бүтээнэ
async function rpCandles(sym,g,a,b){const out=[];let end=b;
  for(let k=0;k<4&&end>=a;k++){const r=await dvSend({ticks_history:sym,style:"candles",granularity:g,end,count:5000,adjust_start_time:1});
    const cs=(r.candles||[]).filter(c=>+c.epoch>=a&&+c.epoch<=b);if(!cs.length)break;out.unshift(...cs);const first=+cs[0].epoch;if(first<=a+g)break;end=first-1}
  const seen=new Set();return out.filter(c=>{const e=+c.epoch;if(seen.has(e))return false;seen.add(e);return true}).sort((x,y)=>x.epoch-y.epoch)}
async function rpTicks(sym,g,a,b,onProg){const win=isGoldInst(CH.inst)?900:3000,wins=[];for(let s=a;s<b;s+=win)wins.push([s,Math.min(b,s+win-1)]);
  const bars=new Map();let done=0,got=0;
  const one=async([s,e])=>{for(let t=0;t<4;t++){try{const r=await dvSend({ticks_history:sym,style:"ticks",start:s,end:e,count:5000});const h=r.history||{};const T=h.times||[],P=h.prices||[];
        for(let i=0;i<T.length;i++){const ep=+T[i];if(ep<a||ep>b)continue;const k=Math.floor(ep/g)*g,p=+P[i];let c=bars.get(k);if(!c){c={epoch:k,open:p,high:p,low:p,close:p,_f:ep,_l:ep};bars.set(k,c)}
          else{if(ep<c._f){c._f=ep;c.open=p}if(ep>=c._l){c._l=ep;c.close=p}if(p>c.high)c.high=p;if(p<c.low)c.low=p}got++}return}
      catch(err){await new Promise(r=>setTimeout(r,1200*(t+1)))}}};
  let next=0;const worker=async()=>{while(next<wins.length){const w=wins[next++];await one(w);done++;onProg&&onProg(done,wins.length)}};
  await Promise.all([worker(),worker(),worker()]);
  return [...bars.values()].sort((x,y)=>x.epoch-y.epoch).map(({_f,_l,...c})=>c)}
// хамгийн эрт боломжтой лааны огноог хоёртын хайлтаар олно (хадгална)
async function rpEarliest(sym,g){const key="alkham-earliest-"+sym+"-"+g;try{const v=JSON.parse(localStorage.getItem(key)||"null");if(v&&Date.now()-v.at<864e5)return v.ep}catch(e){}
  const now=Math.floor(Date.now()/1000);let lo=now-5*365*86400,hi=now-86400;
  const has=async t=>{try{const r=await dvSend({ticks_history:sym,style:"candles",granularity:g,end:t+g*30,count:30,adjust_start_time:1});return (r.candles||[]).some(c=>Math.abs(+c.epoch-t)<g*31)}catch(e){return false}};
  if(await has(lo))hi=lo;else for(let k=0;k<14&&hi-lo>86400;k++){const m=Math.floor((lo+hi)/2);if(await has(m))hi=m;else lo=m}
  try{localStorage.setItem(key,JSON.stringify({ep:hi,at:Date.now()}))}catch(e){}return hi}
async function rpFetch(sym,g,a,b,prog){let cs=await rpCandles(sym,g,a,b);const span=(b-a)/g+1;
  if(g<=300&&cs.length<span*0.5){const tb=await rpTicks(sym,g,a,b,prog);if(tb.length>cs.length){CH.rp.src="tick";return tb}}
  if(cs.length)CH.rp.src="candle";return cs}
async function rpLoad(){
  rpPause();await chForget();const seq=++CH.loadSeq;const ins=CH.inst,g=CH.gran;
  const v=$("#rpStart").value;const start=Math.floor(new Date(v).getTime()/1000);
  if(!v||!isFinite(start)){chStatus("Эхлэх цагаа сонгоно уу.",true);return}
  if(start>Date.now()/1000-g*5){chStatus("Эхлэх цаг өнгөрсөн хугацаанд байх ёстой.",true);return}
  chStatus("Түүхэн өгөгдөл ачаалж байна…");chEmpty("Түүхэн өгөгдөл ачаалж байна…");
  try{const sym=await derivSymbol(ins);if(!sym)throw {code:"InvalidSymbol"};
    const now=Math.floor(Date.now()/1000),preN=g<=60?600:2000,futN=g<=60?1440:5000;CH.rp.src="candle";
    const prog=(d,t)=>{chEmpty(`Deriv-ийн ${tfName(g)} лаа энэ өдөрт алга — тикээс лаа бүтээж байна… ${Math.round(d/t*100)}%`)};
    const pastA=await rpFetch(sym,g,start-preN*g,start-1,prog);if(seq!==CH.loadSeq)return;
    const futA=await rpFetch(sym,g,start,Math.min(now,start+futN*g-g),prog);if(seq!==CH.loadSeq)return;
    const pb=pastA.filter(c=>+c.epoch<start).map(toBar),fb=futA.filter(c=>+c.epoch>=start).map(toBar);
    if(!fb.length){const ep=await rpEarliest(sym,g);const d=new Date(ep*1000);
      throw new Error(`Deriv энэ өдрийн ${tfName(g)} өгөгдөл (лаа, тик) өгөхгүй байна. ${tfName(g)}-ийн хамгийн эрт боломжтой өдөр ≈ ${d.toLocaleDateString("en-GB")}. Тэр өдрөөс хойш сонгоно уу.`)}
    const R=CH.rp;R.sym=sym;R.all=pb.concat(fb);R.idx=Math.max(1,pb.length);R.pos=null;R.markers=[];R.results=[];R.balance=currentBalance(enriched(S.trades));RT.pend=null;RT.pick=null;
    const lag=(+fb[0].time-TZ)-start;if(lag>2*86400)toast(`Deriv ${tfName(g)}-ийн түүх ${new Date((fb[0].time-TZ)*1000).toLocaleDateString("en-GB")}-ээс л эхэлж байна.`);
    CH.series.setData(R.all.slice(0,R.idx));CH.series.setMarkers([]);const b=R.all[R.idx-1];CH.last=b.close;CH.lastTime=b.time;
    CH.chart.timeScale().scrollToRealTime();chEmpty("");rpTimeLabel();
    chStatus(`Давтан тоглуулах · ${sym} · ${fb.length} лаа бэлэн${R.src==="tick"?" · тикээс бүтээсэн":""}`);chUpdate();
  }catch(e){if(seq!==CH.loadSeq)return;chStatus(dvErrMsg(e),true);chEmpty(esc(dvErrMsg(e)))}
}
async function rpMore(){const R=CH.rp;if(R.loading||!R.all.length)return false;const g=CH.gran,lastEp=R.all[R.all.length-1].time-TZ,now=Math.floor(Date.now()/1000);
  if(lastEp+g>=now-g)return false;R.loading=true;
  try{const n=R.src==="tick"?720:5000;const cs=await rpFetch(R.sym,g,lastEp+g,Math.min(now,lastEp+n*g));
    const add=cs.map(toBar).filter(b=>b.time>R.all[R.all.length-1].time);R.all=R.all.concat(add);return add.length>0}
  catch(e){return false}finally{R.loading=false}}
async function rpStep(){const R=CH.rp;if(!R.all.length){chStatus("Эхлээд Ачаалах дарна уу.",true);return}
  if(R.idx>=R.all.length-(R.src=="tick"?300:50))rpMore();
  if(R.idx>=R.all.length){rpPause();chStatus("Өгөгдлийн төгсгөлд хүрлээ.");return}
  const bar=R.all[R.idx++];CH.series.update(bar);CH.last=bar.close;CH.lastTime=bar.time;rtFill(bar);rpCheck(bar);rpTimeLabel();chUpdate(true)}
function rpTimeLabel(){const R=CH.rp,b=R.all[R.idx-1];$("#rpTime").textContent=b?new Date((b.time-TZ)*1000).toLocaleString("en-GB",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):""}
function rpPlay(){const R=CH.rp;if(R.timer){rpPause();return}if(!R.all.length){chStatus("Эхлээд Ачаалах дарна уу.",true);return}
  R.timer=setInterval(rpStep,1000/(R.speed||2));$("#rpPlay").textContent="❚❚ Зогсоох"}
function rpPause(){const R=CH.rp;if(R.timer){clearInterval(R.timer);R.timer=null}const b=$("#rpPlay");if(b)b.textContent="▶ Тоглуулах"}
function rpOpen(){const R=CH.rp;const o=chCalc();if(o.lots==null||o.sl==null)return;
  const bar=R.all[R.idx-1];R.pos={dir:CH.dir,entry:bar.close,sl:o.sl,tp:o.tp,lots:o.lots,risk:o.risk,time:bar.time,epoch:bar.time-TZ,balance:R.balance};
  R.markers.push({time:bar.time,position:CH.dir==="Buy"?"belowBar":"aboveBar",color:cssVar("--accent"),shape:CH.dir==="Buy"?"arrowUp":"arrowDown",text:CH.dir});
  CH.series.setMarkers(R.markers.slice().sort((a,b)=>a.time-b.time));chUpdate()}
function rpCheck(bar){const R=CH.rp,p=R.pos;if(!p||bar.time<=p.time)return;const buy=p.dir==="Buy";
  const hitSl=buy?bar.low<=p.sl:bar.high>=p.sl;const hitTp=p.tp!=null&&(buy?bar.high>=p.tp:bar.low<=p.tp);
  if(hitSl)rpClose(p.sl,"SL",bar);else if(hitTp)rpClose(p.tp,"TP",bar)} // нэг лаанд хоёулаа хүрвэл SL гэж үзнэ (болгоомжтой)
function rpClose(price,reason,bar){const R=CH.rp,p=R.pos;if(!p)return;bar=bar||R.all[R.idx-1];
  const cs=+CH.inst.cs||1,pnl=(price-p.entry)*(p.dir==="Buy"?1:-1)*p.lots*cs,Rv=p.risk?pnl/p.risk:null;
  R.results.push({inst:CH.inst.name,dir:p.dir,entry:p.entry,sl:p.sl,tp:p.tp,exit:price,lots:p.lots,pnl,R:Rv,reason,openEp:p.epoch,closeEp:bar.time-TZ,balance:p.balance,saved:false});
  R.balance+=pnl;R.pos=null;
  R.markers.push({time:bar.time,position:"inBar",color:pnl>=0?cssVar("--gain"):cssVar("--loss"),shape:"circle",text:`${reason} ${rfmt(Rv)}`});

/* --- координат: хадгалахдаа жинхэнэ epoch, графикт TZ нэмсэн цаг --- */
function dX(ep){const data=CH.series.data();if(!data.length)return null;const t=ep+TZ,n=data.length,g=CH.gran,ts=CH.chart.timeScale();let l;
  if(t>=data[n-1].time)l=(n-1)+(t-data[n-1].time)/g;
  else if(t<=data[0].time)l=(t-data[0].time)/g;
  else{let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(data[m].time<=t)lo=m;else hi=m}l=lo+(t-data[lo].time)/((data[hi].time-data[lo].time)||g)}
  return ts.logicalToCoordinate(l)}
function xEp(x){const data=CH.series.data();if(!data.length)return null;const l=CH.chart.timeScale().coordinateToLogical(x);if(l==null)return null;const n=data.length;let t;
  if(l>=n-1)t=data[n-1].time+(l-(n-1))*CH.gran;else if(l<=0)t=data[0].time+l*CH.gran;else{const i=Math.floor(l),f=l-i;t=data[i].time+f*(data[i+1].time-data[i].time)}
  return Math.round(t-TZ)}
const pY=p=>CH.series.priceToCoordinate(p),yP=y=>CH.series.coordinateToPrice(y);
// соронз: курсорын доорх лааны O/H/L/C-д наалдана
function drSnap(x,y){const data=CH.series.data();const l=CH.chart.timeScale().coordinateToLogical(x);if(l==null)return null;const i=Math.round(l);
  if(i<0||i>=data.length)return null;const b=data[i];let best=null;
  for(const p of [b.open,b.high,b.low,b.close]){const yy=pY(p);if(yy==null)continue;const d=Math.abs(yy-y);if(!best||d<best.d)best={d,p}}
  return best&&best.d<14?{t:b.time-TZ,p:best.p}:null}

  if(DR.magnet&&!noSnap&&!e.ctrlKey){const s=drSnap(x,y);if(s)return {x,y,t:s.t,p:s.p,snap:true}}

function drSessions(ctx,box,font){const t0=xEp(0),t1=xEp(box.w);if(t0==null||t1==null)return;const day=86400;
  ctx.font=`11px ${font}`;ctx.textBaseline="top";

// Дээд интервалын лааны эхлэл: UTC-д тулгуурласан, 7 хоног Даваа 00:00 UTC-ээс
const WEEK_OFF=345600; // 1970-01-05 (Даваа)
const htfKeyUtc=(ep,H)=>H===604800?Math.floor((ep-WEEK_OFF)/H)*H+WEEK_OFF:Math.floor(ep/H)*H;
// Алт: TradingView / брокерууд (Pepperstone г.м.) 4ц, өдөр, 7 хоногийг Нью-Йоркийн 18:00-ийн сешнээс эхлүүлдэг (зун 22:00 UTC, өвөл 23:00 UTC)
function usDst(ep){const y=new Date(ep*1000).getUTCFullYear();
  const nth=(m,n)=>{const d=new Date(Date.UTC(y,m,1));const first=(7-d.getUTCDay())%7;return Date.UTC(y,m,1+first+7*(n-1))/1000};
  return ep>=nth(2,2)+7*3600&&ep<nth(10,1)+6*3600}
function nyOff(ep){return usDst(ep)?4*3600:5*3600}
function goldSess(ep){let off=18*3600+nyOff(ep),s=Math.floor((ep-off)/86400)*86400+off;
  const off2=18*3600+nyOff(s);if(off2!==off){s=Math.floor((ep-off2)/86400)*86400+off2;if(s>ep)s-=86400}return s}
function goldKey(ep,H){const s=goldSess(ep);
  if(H===86400)return s;
  if(H===604800){const wd=new Date((s-nyOff(s))*1000).getUTCDay();/* сешн эхэлсэн Нью-Йоркийн өдөр: 0=Ням */return goldSess(s-wd*86400+3600)}
  return s+Math.floor((ep-s)/H)*H}
const isGoldInst=ins=>!!ins&&(ins.kind==="gold"||/xau|gold/i.test(ins.name||""));
const goldSessOn=H=>H>=14400&&isGoldInst(CH.inst);
const htfKey=(ep,H)=>goldSessOn(H)?goldKey(ep,H):htfKeyUtc(ep,H);
const MTF={real:null,key:"",busy:false,check:null};
// Шууд горимд Deriv-ийн жинхэнэ лааг ачаална (15м, 1ц, 4ц, 1ө). 7 хоногийн лааг Deriv өгдөггүй тул нэгтгэж тооцно.
async function mtfLoadReal(){const H=DR.mtf,data=CH.series?CH.series.data():[];const gs=goldSessOn(H);
  if(!H||(H===604800&&!gs)||CH.mode!=="live"||!CH.sym||!data.length||H<=CH.gran){MTF.real=null;MTF.check=null;mtfStatus();return}
  const key=CH.sym+"|"+H+"|"+CH.gran+"|"+data[0].time+"|"+gs;if(MTF.key===key||MTF.busy)return;MTF.busy=true;
  try{const start=data[0].time-TZ;
    // алт: Deriv-ийн 4ц/өдрийн лаа UTC-ээр эхэлдэг тул TradingView-тэй зөрнө. Иймд Deriv-ийн 1ц лааг Нью-Йоркийн сешнээр нэгтгэнэ
    const r=await dvSend({ticks_history:CH.sym,style:"candles",granularity:gs?3600:H,start:gs?goldKey(start,H):start,end:"latest",count:5000});
    const m=new Map();
    if(gs){(r.candles||[]).forEach(c=>{const ep=+c.epoch,k=goldKey(ep,H),R=m.get(k);if(!R)m.set(k,{o:+c.open,h:+c.high,l:+c.low,c:+c.close});else{R.h=Math.max(R.h,+c.high);R.l=Math.min(R.l,+c.low);R.c=+c.close}})}
    else(r.candles||[]).forEach(c=>m.set(+c.epoch,{o:+c.open,h:+c.high,l:+c.low,c:+c.close}));MTF.real=m;MTF.key=key;mtfVerify()}
  catch(e){MTF.real=null;MTF.check={err:true}}finally{MTF.busy=false;mtfStatus();drDirty()}}
function mtfGroups(data,H,i0,i1){let cur=null;const out=[];
  for(let i=i0;i<=i1;i++){const b=data[i],ep=b.time-TZ,k=htfKey(ep,H);
    if(!cur||cur.k!==k){cur={k,o:b.open,h:b.high,l:b.low,c:b.close,first:ep,i0:i,n:1};out.push(cur)}else{cur.h=Math.max(cur.h,b.high);cur.l=Math.min(cur.l,b.low);cur.c=b.close;cur.n++}}
  // эхний бүлэг хугацааныхаа дундаас эхэлсэн бол дутуу тул хасна
  if(out.length&&out[0].first!==out[0].k&&out[0].i0===0)out[0].partial=true;
  return out}
function mtfVerify(){const data=CH.series.data(),H=DR.mtf,g=CH.gran;if(!MTF.real||!data.length){MTF.check=null;return}
  const groups=mtfGroups(data,H,0,data.length-1);const tol=(+CH.inst.tick||0.01)/2+1e-9;let ok=0,bad=0,ex=null;
  groups.forEach((G,idx)=>{if(G.partial||idx===groups.length-1)return;const R=MTF.real.get(G.k);if(!R)return;
    const same=Math.abs(R.o-G.o)<=tol&&Math.abs(R.h-G.h)<=tol&&Math.abs(R.l-G.l)<=tol&&Math.abs(R.c-G.c)<=tol;if(same)ok++;else{bad++;if(!ex)ex={k:G.k,G,R}}});
  MTF.check={ok,bad,ex}}
function mtfStatus(){const el=$("#mtfCheck");if(!el)return;const H=DR.mtf;
  if(!H){el.textContent="";return}
  if(H<=CH.gran){el.textContent="Графикийн интервалаас их байх ёстой";el.className="mtf-check bad";return}
  if(CH.mode==="replay"){el.textContent="Давтан тоглуулалт: харагдаж буй лаагаар нэгтгэв (ирээдүйг харуулахгүй)";el.className="mtf-check";return}
  const gs=goldSessOn(H);

/* ---------------- Төстэй хэв маяг (өнгөрсөнд давтагдсан хөдөлгөөн) ---------------- */
const PAT={open:false,res:null,w:30,h:20,k:20,show:true,focus:null,t:0,lastN:0,lastClose:null,tab:(()=>{try{return localStorage.getItem("alkham-pat-tab")||"np"}catch(e){return "np"}})()};
function patStats(a){const n=a.length;if(!n)return {mean:0,med:0};const s=a.slice().sort((x,y)=>x-y);return {mean:a.reduce((x,y)=>x+y,0)/n,med:n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,p25:s[Math.floor(n*0.25)],p75:s[Math.min(n-1,Math.floor(n*0.75))]}}
function patRun(){
  const data=CH.series?CH.series.data():[];const n=data.length,w=PAT.w,h=PAT.h,K=PAT.k;
  if(n<w*4+h){PAT.res={err:`Хангалттай өгөгдөл алга (${n} лаа). Дор хаяж ${w*4+h} лаа хэрэгтэй — графикийг зүүн тийш гүйлгэж хуучин түүх ачаална уу.`};return}
  const c=new Float64Array(n);for(let i=0;i<n;i++)c[i]=data[i].close;
  const cur=c.subarray(n-w);let cm=0;for(const v of cur)cm+=v;cm/=w;let cv=0;for(const v of cur)cv+=(v-cm)**2;const cs=Math.sqrt(cv/w);
  if(!cs){PAT.res={err:"Сүүлийн лааны үнэ өөрчлөгдөөгүй тул харьцуулах боломжгүй."};return}
  const z=new Float64Array(w);for(let j=0;j<w;j++)z[j]=(cur[j]-cm)/cs;
  const P1=new Float64Array(n+1),P2=new Float64Array(n+1);for(let i=0;i<n;i++){P1[i+1]=P1[i]+c[i];P2[i+1]=P2[i]+c[i]*c[i]}
  const lastStart=n-w-h-w;const cand=[];
  for(let s=0;s<=lastStart;s++){const m=(P1[s+w]-P1[s])/w,va=(P2[s+w]-P2[s])/w-m*m;if(va<=1e-12)continue;let dot=0;for(let j=0;j<w;j++)dot+=z[j]*c[s+j];
    const r=dot/w/Math.sqrt(va);if(r>0.5)cand.push([s,r,m,Math.sqrt(va)])}
  cand.sort((a,b)=>b[1]-a[1]);const pick=[],used=[];
  for(const x of cand){if(pick.length>=K)break;if(used.some(u=>Math.abs(u-x[0])<w))continue;used.push(x[0]);pick.push(x)}
  if(!pick.length){PAT.res={err:"Төстэй хэв маяг олдсонгүй. Цонхны уртыг багасгах эсвэл илүү урт түүх ачаалж үзнэ үү."};return}
  const ins=CH.inst,tick=+ins.tick||0.01;
  const matches=pick.map(([s,r,m,sd])=>{const e=s+w-1,sc=cs/sd;const past=[],fut=[];
    for(let j=0;j<w;j++)past.push((c[s+j]-m)*sc+cm);
    let mfe=0,mae=0;for(let j=0;j<=h;j++){const d=(c[e+j]-c[e])*sc;fut.push(d);if(d>mfe)mfe=d;if(d<mae)mae=d}
    return {s,e,r,past,fut,move:fut[h],raw:c[e+h]-c[e],time:data[e].time-TZ,mfe,mae}});
  const ups=matches.filter(x=>x.move>0).length,downs=matches.filter(x=>x.move<0).length,N=matches.length;
  let bu=0,bd=0;for(let i=w;i+h<n;i++){const d=c[i+h]-c[i];if(d>0)bu++;else if(d<0)bd++}
  const meanPath=[],p25=[],p75=[];for(let j=0;j<=h;j++){const col=matches.map(x=>x.fut[j]);const st=patStats(col);meanPath.push(st.mean);p25.push(st.p25);p75.push(st.p75)}
  const pB=ups/N,moe=1.96*Math.sqrt(0.25/N);
  PAT.res={matches,N,ups,downs,buy:ups/N,sell:downs/N,base:{buy:bu/(bu+bd||1),sell:bd/(bu+bd||1),n:bu+bd},moe,
    move:patStats(matches.map(x=>x.move)),mfe:patStats(matches.map(x=>x.mfe)),mae:patStats(matches.map(x=>x.mae)),
    cur:Array.from(cur),meanPath,p25,p75,n,lastEp:data[n-1].time-TZ,lastClose:c[n-1],tick,w,h,
    signif:Math.abs(pB-0.5)>moe};
  PAT.lastN=n;PAT.lastClose=c[n-1];
}
function patSvg(R){const W=640,H=230,padL=8,padR=56,padT=12,padB=22,w=R.w,h=R.h;
  const all=[];R.cur.forEach(v=>all.push(v));const base=R.cur[R.cur.length-1];

function npDetect(o,h,l,c,opt){const n=c.length,k=opt.k||5,W=opt.wait||Math.max(20,k*6);const atr=npATR(h,l,c,14);const occ=[],forming=[];

    if(c[j-1]>o[j-1]&&c[j]<o[j]&&c[j]<=o[j-1]&&o[j]>=c[j-1]&&bo>=0.5*a&&c[j-1]>c[j-6])push("eng_d",j,[[j-1,h[j-1]],[j,l[j]]]);
    const lw=Math.min(o[j],c[j])-l[j],uw=h[j]-Math.max(o[j],c[j]);let mnL=Infinity,mxH=-Infinity;for(let t=j-10;t<j;t++){if(l[t]<mnL)mnL=l[t];if(h[t]>mxH)mxH=h[t]}

const NP=(()=>{let s={};try{s=JSON.parse(localStorage.getItem("alkham-np")||"{}")}catch(e){}

async function npYear(force){const key=npYearKey();if(!force&&NPY.key===key&&NPY.t&&!NPY.err)return NPY;if(NPY.busy&&NPY.busyKey===key)return NPY.busy;

function npExtra(R){const D=R.D,mid=D.t[0]+(D.t[D.n-1]-D.t[0])/2,base=R.base.buy;

      const t=D.t[x.b];(t<mid?h1:h2)[r.res]++;const hr=new Date(t*1000).getUTCHours();ss[NP_SESS.findIndex(q=>hr>=q[1]&&hr<q[2])][r.res]++;bars+=r.j-x.b;nb++});

function npMini(R,x){const D=R.D,pI=x.pts.map(p=>p[0]);const o=x.out||{};let i0=Math.max(0,Math.min(...pI,x.b)-12),i1=Math.min(D.n-1,Math.max(x.b,o.j||x.b)+8);

  if(oU!=null){const xe=X(Math.min(i1,o.j||x.b)),xb=X(x.b),bx=(a,b2,col)=>`<rect x="${xb}" y="${Math.min(Y(a),Y(b2))}" width="${Math.max(1,xe-xb)}" height="${Math.abs(Y(a)-Y(b2))}" fill="${col}" fill-opacity=".14"/>`;g+=bx(o.E,oU,"#089981")+bx(o.E,oD,"#F23645")}
  let cs="";const cw=Math.max(1,bw*0.7);for(let i=i0;i<=i1;i++){const up=D.c[i]>=D.o[i],col=up?"#089981":"#F23645",xx=X(i),yt=Y(Math.max(D.o[i],D.c[i])),yb=Y(Math.min(D.o[i],D.c[i]));

// Нэг арилжааг дуусгах: SL/TP-ийн аль нь түрүүлэх, нэг лаанд хоёуланд хүрвэл SL (болгоомжтой), хугацаа дуусвал хаалтаар
function botTrade(D,b,dir,sl,tp,maxB){const n=D.n;for(let j=b+1;j<=Math.min(n-1,b+maxB);j++){
    const hitSL=dir>0?D.l[j]<=sl:D.h[j]>=sl,hitTP=dir>0?D.h[j]>=tp:D.l[j]<=tp;
    if(hitSL)return {j,exit:sl,why:"SL"};if(hitTP)return {j,exit:tp,why:"TP"}}
  const j=Math.min(n-1,b+maxB);return j>=b+maxB?{j,exit:D.c[j],why:"хугацаа"}:null}
function botSim(R,signals,opt){const D=R.D,atr=opt.atr,sp=opt.spread,riskP=opt.risk/100;let busyTill=-1,eq=0,peak=0,dd=0,bal=1,balPeak=1,ddP=0;const trades=[],curve=[0];
  for(const sg of signals){if(sg.b<=busyTill)continue;const a=atr[sg.b];if(!(a>0))continue;const E=D.c[sg.b],dist=opt.slM*a,dir=sg.dir;
    const sl=E-dir*dist,tp=E+dir*dist*opt.rr;const r=botTrade(D,sg.b,dir,sl,tp,opt.maxB);if(!r)continue;
    const R1=((r.exit-E)*dir-sp)/dist;busyTill=r.j;eq+=R1;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);
    bal*=1+riskP*R1;balPeak=Math.max(balPeak,bal);ddP=Math.max(ddP,1-bal/balPeak);
    trades.push({b:sg.b,j:r.j,id:sg.id,dir,E,sl,tp,exit:r.exit,why:r.why,R:R1});curve.push(eq)}
  const N=trades.length,w=trades.filter(t=>t.R>0),l=trades.filter(t=>t.R<=0);const gw=w.reduce((s,t)=>s+t.R,0),gl=-l.reduce((s,t)=>s+t.R,0);

    for(let k=0;k<20;k++){const rsig=[];for(let q=0;q<main.N*2;q++)rsig.push({b:15+Math.floor(rnd()*(D.n-16-opt.maxB)),dir:rnd()<0.5?1:-1});rsig.sort((x,y)=>x.b-y.b);

/* --- Давтан тоглуулалтын арилжаа: нэг товшилтын Buy/Sell, лимит/стоп, графикт чирэх SL/TP, товчлол, статистик --- */
const RT=(()=>{let s={};try{s=JSON.parse(localStorage.getItem("alkham-rt")||"{}")}catch(e){}
  return {ot:s.ot||"mkt",sl:s.sl||"atr1.5",rr:s.rr||2,pick:null,pend:null,drag:null,stats:!!s.stats}})();

const rtOn=()=>CH.mode==="replay"&&CH.rp.all.length>0;

function rtBars(){const R=CH.rp;return R.all.slice(Math.max(0,R.idx-60),R.idx)}
function rtATR(){const b=rtBars();if(b.length<3)return 0;let s=0,k=0;for(let i=Math.max(1,b.length-14);i<b.length;i++){s+=Math.max(b[i].high-b[i].low,Math.abs(b[i].high-b[i-1].close),Math.abs(b[i].low-b[i-1].close));k++}return k?s/k:0}
function rtDefaults(dir,entry){const d=dir==="Buy"?1:-1,tick=+CH.inst.tick||0.01;let sl;
  if(RT.sl==="swing"){const b=rtBars().slice(-20);sl=d>0?Math.min(...b.map(x=>x.low))-tick:Math.max(...b.map(x=>x.high))+tick;if((entry-sl)*d<=tick)sl=entry-d*rtATR()}
  else{const m=+RT.sl.replace("atr","")||1.5;sl=entry-d*m*(rtATR()||entry*0.001)}
  sl=rtRound(sl);const tp=rtRound(entry+d*Math.abs(entry-sl)*RT.rr);return {sl,tp}}
function rtLots(entry,sl){const ins=CH.inst,cs=+ins.cs||1,step=+ins.lotStep||0.01,minLot=+ins.minLot||step,dist=Math.abs(entry-sl);if(!dist)return minLot;
  const lots=Math.floor(CH.rp.balance*(CH.risk||1)/100/(dist*cs)/step+1e-9)*step;return +Math.max(minLot,lots).toFixed(4)}
function rtOpenPos(dir,entry,sl,tp,lots,bar){const R=CH.rp,cs=+CH.inst.cs||1;
  R.pos={dir,entry,sl,tp,lots,risk:Math.abs(entry-sl)*cs*lots,time:bar.time,epoch:bar.time-TZ,balance:R.balance,idx:R.idx};
  R.markers.push({time:bar.time,position:dir==="Buy"?"belowBar":"aboveBar",color:dir==="Buy"?"#2962FF":"#F23645",shape:dir==="Buy"?"arrowUp":"arrowDown",text:`${dir} ${fm(lots,2)}`});

  const bar=R.all[R.idx-1],E=bar.close,{sl,tp}=rtDefaults(dir,E);rtOpenPos(dir,E,sl,tp,rtLots(E,sl),bar)}

function btHist(title,cats,vals){const W=520,H=220,pl=34,pr=10,pt=26,pb=28,n=cats.length,mx=Math.max(1,...vals),Y=v=>pt+(H-pt-pb)*(1-v/mx),bw=(W-pl-pr)/n;let g="";

  cats.forEach((c,i)=>{const v=vals[i],x=pl+i*bw+bw*0.15,w=bw*0.7,y=Y(v),neg=i<2;
    g+=`<g><title>${esc(c)}R: ${v} арилжаа</title><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(0)-y).toFixed(1)}" rx="3" fill="${neg?BT_NEG:BT_POS}" fill-opacity="${i===2?0.55:1}"/></g>
      ${v?`<text x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="10" text-anchor="middle" fill="var(--ink)">${v}</text>`:""}<text x="${(x+w/2).toFixed(1)}" y="${H-pb+14}" font-size="10" text-anchor="middle" fill="var(--ink)">${esc(c)}</text>`});
  return `<figure class="bt-fig"><figcaption>${esc(title)}</figcaption><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g}</svg></figure>`}

      if(r.status===401||r.status===403){SB.err="Сервер түлхүүрийг хүлээж авсангүй. Холболтыг засах дарж publishable key-ээ дахин хуулж оруулна уу.";SB.raw=`HTTP ${r.status}: ${txt.slice(0,160)}`;SB.info=""}
      else if(!r.ok){SB.err="Серверээс алдаа ирлээ. Төсөл зогссон эсэхийг Supabase dashboard дээр шалгана уу.";SB.raw=`HTTP ${r.status}: ${txt.slice(0,160)}`;SB.info=""}
      else{const j=JSON.parse(txt);const rows=[["Сервертэй холболт","✓ Хэвийн"],["Шинэ бүртгэл",j.disable_signup?"✗ Хаалттай — Allow new users to sign up-ийг асаана уу":"✓ Нээлттэй"],
          ["Имэйл баталгаажуулалт",j.mailer_autoconfirm?"✓ Шаардлагагүй (шууд нэвтэрнэ)":"Шаардлагатай — бүртгүүлсний дараа имэйлээ баталгаажуулна"],["Имэйлээр нэвтрэх",j.external&&j.external.email===false?"✗ Унтраалттай":"✓ Идэвхтэй"]];
        SB.info=rows.map(([k,v])=>`<b>${k}:</b> ${esc(v)}`).join("<br>")}}
    catch(e){SB.info="";SB.err=supaMsg(e)}
    SB.busy=false;render()}
  else if(act==="sbForgot"){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    const email=($("#sbEmail").value||"").trim();SB.draft.email=email;SB.err="";SB.raw="";SB.info="";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){SB.err="Нууц үг сэргээх имэйл хаягаа Имэйл талбарт бичээд дахин дарна уу.";render();return}
    SB.busy=true;SB.info="Сэргээх холбоос илгээж байна…";render();
    try{const {error}=await withTimeout(SB.client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}),20000);if(error)throw error;
      SB.info=`<b>${esc(email)}</b> хаяг руу нууц үг сэргээх холбоос илгээлээ. Gmail-ээ (Spam хавтсыг ч) шалгаад холбоос дээр дарна уу. Энэ хуудас нээгдэж, шинэ нууц үг тохируулах цонх гарна. Хэдэн минутын дотор ирэхгүй бол Supabase → Authentication → URL Configuration-д Site URL зөв эсэхийг шалгана уу.`}
    catch(e){SB.info="";SB.err=supaMsg(e)}
    SB.busy=false;render()}
  else if(act==="sbPwToggle"){SB.pwOpen=!SB.pwOpen;SB.err="";SB.info="";render();if(SB.pwOpen)setTimeout(()=>{const el=$("#sbNew1");if(el)el.focus()},50)}
  else if(act==="sbSetPw"){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    const p1=$("#sbNew1").value||"",p2=$("#sbNew2").value||"";SB.err="";SB.raw="";SB.info="";
    if(p1.length<6){SB.err="Шинэ нууц үг хамгийн багадаа 6 тэмдэгт байх ёстой.";render();return}
    if(p1!==p2){SB.err="Хоёр нууц үг таарахгүй байна. Дахин бичнэ үү.";render();return}
    SB.busy=true;SB.info="Хадгалж байна…";render();
    try{const {error}=await withTimeout(SB.client.auth.updateUser({password:p1}),20000);if(error)throw error;
      SB.info="";SB.recovery=false;SB.pwOpen=false;toast("Нууц үг шинэчлэгдлээ");}
    catch(e){SB.info="";SB.err=supaMsg(e)}
    SB.busy=false;render()}
  else if(act==="sbShow"){const el=$("#sbPass");if(el){el.type=el.type==="password"?"text":"password";a.textContent=el.type==="password"?"Харах":"Нуух"}}
  else if(act==="sbOut"){a.disabled=true;await flushPending();
    if(pendingGet().some(o=>SB.user&&o.u===SB.user.id)){a.disabled=false;toast("Илгээгдээгүй өөрчлөлт байна. Интернэтээ шалгаад Одоо синк хийх дарсны дараа гарна уу.");return}
    await SB.client.auth.signOut();S.view="dash";toast("Гарлаа")}
  else if(act==="sbSync"){await flushPending();await pullAll();toast(SB.status==="ok"?"Синк хийлээ":SB.err||"Синк хийж чадсангүй")}
  else if(act==="sbMigrate")supaMigrateLocal();
  else if(act==="sbForget"){try{localStorage.removeItem(SUPA_CFG_KEY)}catch(e){}if(SB.cfg){SB.draft.url=SB.cfg.url;SB.draft.key=SB.cfg.key}SB.cfg=null;SB.client=null;SB.status="off";SB.err="";setMode();render()}
  else if(act==="migrate"){const lc=S.localCache;for(const coll of ["trades","days","reviews","beliefs"]){for(const [k,v] of Object.entries(lc[coll]||{}))await put(coll,k,v)}if(lc.settings)await saveSettings(lc.settings);toast("Шилжүүллээ")}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sbPass"){e.preventDefault();const b=$("[data-act=sbIn]");if(b)b.click();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-edit]")){e.preventDefault();openForm(e.target.dataset.edit)}});
function collectSettings(){const s=clone(S.settings);const g=id=>{const el=$("#"+id);return el?el.value:null};
  if(g("sCur")!=null){s.currency=g("sCur")||"$";s.startBalance=num(g("sBal"))??0;s.riskPct=num(g("sRisk"))??1;s.maxRiskPct=num(g("sMaxRisk"))??2;s.dailyLossPct=num(g("sDaily"))??3;s.maxTradesDay=num(g("sMaxT"))??5;
    s.setups=g("sSetups").split("\n").map(x=>x.trim()).filter(Boolean);
    s.instruments=$$("[data-inst]").map(row=>{const o={};$$("[data-k]",row).forEach(el=>{if(el.tagName==="INPUT")o[el.dataset.k]=el.type==="number"?(num(el.value)??0):el.value.trim()});o.kind=/step/i.test(o.name)?"step":/xau|gold|алт/i.test(o.name)?"gold":"other";return o}).filter(i=>i.name)}
  return s}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.draft;if(k)SB.draft[k]=e.target.value});
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(f)importJson(f);e.target.value=""});
$("#tradeForm").addEventListener("input",updatePreview);
$("#tradeForm").addEventListener("change",updatePreview);
$("#tradeForm").addEventListener("submit",e=>{e.preventDefault();submitForm()});
$("#dlg").addEventListener("close",()=>{editing=null});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.id==="fInst"){S.filter.inst=el.value;doRender()}else if(el.id==="fMonth"){S.filter.month=el.value;doRender()}else if(el.id==="fRes"){S.filter.res=el.value;doRender()}
  else if(el.dataset.daynote){const today=ymd(new Date());const d=clone(S.days[today]||{a:{}});d.note=el.value;await put("days",today,d)}
  else if(el.dataset.review!=null){const k=S.week;const r=clone(S.reviews[k]||{a:{}});r.a=r.a||{};r.a["q"+el.dataset.review]=el.value;await put("reviews",k,r)}
  else if(el.dataset.belief!=null){const k=S.month;const r=clone(S.beliefs[k]||{a:{}});r.a=r.a||{};r.a["q"+el.dataset.belief]=el.value;await put("beliefs",k,r)}
});
let pressing=false;
document.addEventListener("pointerdown",e=>{if(e.target.closest("button,a,[data-act],[data-edit],select,label"))pressing=true},true);
document.addEventListener("pointerup",()=>{setTimeout(()=>{pressing=false;if(S.renderSkipped)afterBlur()},0)},true);
document.addEventListener("pointercancel",()=>{pressing=false},true);
function afterBlur(){const a=document.activeElement;if(pressing)return;if(!a||!$("#app").contains(a)||!(a.tagName==="TEXTAREA"||a.tagName==="INPUT"))render()}
document.addEventListener("focusout",e=>{
  // Товч, холбоос руу шилжиж байгаа бол товшилт дуусахаас өмнө хуудсыг дахин зурахгүй (эс тэгвээс товшилт алга болно)
  const to=e.relatedTarget;if(pressing||(to&&to.closest&&to.closest("button,a,[data-act]")))return;
  if(!S.renderSkipped)return;setTimeout(afterBlur,0)});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==="dash")render()},200)});

setMode();doRender();connect();
})();
</script>

</body>
</html>
